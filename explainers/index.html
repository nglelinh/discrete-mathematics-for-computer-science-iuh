<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explainer — xem trước (dev)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
      header { padding: 16px 24px; background: #004586; color: #fff; }
      header h1 { margin: 0; font-size: 1.15rem; }
      header p { margin: 6px 0 0; opacity: .9; font-size: .92rem; }
      main { max-width: 1100px; margin: 0 auto; padding: 20px; }
      section { margin: 0 0 28px; }
      h2 { color: #004586; font-size: 1.05rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Explainer Toán rời rạc — chế độ dev</h1>
      <p>Trang này chỉ dùng khi chạy <code>npm run dev</code> trong thư mục <code>explainers/</code>. Bundle cho Jekyll được tạo bằng <code>npm run build</code>.</p>
    </header>
    <main>
      <section>
        <h2>Graph Explainer</h2>
        <div data-demo="graph-explainer" data-algorithm="bfs"></div>
      </section>
      <section>
        <h2>Boolean Explainer</h2>
        <div data-demo="boolean-explainer" data-vars="3"></div>
      </section>
    </main>
    <script type="module" src="/src/graph/main.js"></script>
    <script type="module" src="/src/boolean/main.js"></script>
  </body>
</html>
