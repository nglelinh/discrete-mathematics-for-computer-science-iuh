<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Venn diagram three sets">
  <rect width="720" height="400" fill="#fafbfc"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Biểu đồ Venn — ba tập A, B, C</text>
  <circle cx="300" cy="210" r="110" fill="#dbeafe" fill-opacity="0.55" stroke="#004586" stroke-width="2"/>
  <circle cx="420" cy="210" r="110" fill="#fecaca" fill-opacity="0.55" stroke="#b42318" stroke-width="2"/>
  <circle cx="360" cy="120" r="110" fill="#bbf7d0" fill-opacity="0.55" stroke="#15803d" stroke-width="2"/>
  <text x="230" y="230" font-size="16" font-weight="600" fill="#004586">A</text>
  <text x="490" y="230" font-size="16" font-weight="600" fill="#b42318">B</text>
  <text x="360" y="70" font-size="16" font-weight="600" fill="#15803d">C</text>
  <text x="360" y="205" text-anchor="middle" font-size="11" fill="#5c6370">A∩B∩C</text>
  <text x="360" y="360" text-anchor="middle" font-size="12" fill="#5c6370">7 vùng phân biệt — dùng cho nguyên lý bù trừ</text>
</svg>