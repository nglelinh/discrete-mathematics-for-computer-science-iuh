<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Dijkstra">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 14px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Dijkstra từ A — khoảng cách ngắn nhất (trọng số ≥ 0)</text>
  <line class="e" x1="100" y1="120" x2="260" y2="80"/>
  <line class="e" x1="100" y1="120" x2="240" y2="200"/>
  <line class="e" x1="260" y1="80" x2="420" y2="120"/>
  <line class="e" x1="260" y1="80" x2="300" y2="200"/>
  <line class="e" x1="240" y1="200" x2="300" y2="200"/>
  <line class="e" x1="420" y1="120" x2="300" y2="200"/>
  <line class="e" x1="420" y1="120" x2="520" y2="200"/>
  <line class="e" x1="300" y1="200" x2="520" y2="200"/>
    <circle class="n" cx="100" cy="120" r="18"/>
  <text class="nt" x="100" y="125" text-anchor="middle">A</text>
    <circle class="n" cx="260" cy="80" r="18"/>
  <text class="nt" x="260" y="85" text-anchor="middle">B</text>
    <circle class="n" cx="240" cy="200" r="18"/>
  <text class="nt" x="240" y="205" text-anchor="middle">C</text>
    <circle class="n" cx="420" cy="120" r="18"/>
  <text class="nt" x="420" y="125" text-anchor="middle">D</text>
    <circle class="n" cx="300" cy="200" r="18"/>
  <text class="nt" x="300" y="205" text-anchor="middle">E</text>
    <circle class="n" cx="520" cy="200" r="18"/>
  <text class="nt" x="520" y="205" text-anchor="middle">F</text>
  <text class="l" x="170" y="85">1</text>
  <text class="l" x="150" y="175">4</text>
  <text class="l" x="340" y="85">2</text>
  <text class="l" x="290" y="150">2</text>
  <text class="l" x="260" y="220">1</text>
  <text class="l" x="370" y="150">3</text>
  <text class="l" x="480" y="140">5</text>
  <text class="l" x="400" y="220">1</text>
  <rect class="hi" x="40" y="250" width="640" height="55" rx="8"/>
  <text class="l" x="60" y="275">dist: A=0, B=1, C=3 (A→B→C:1+2), E=3, D=3, F=4 (qua E)</text>
  <text class="cap" x="360" y="320" text-anchor="middle">Chốt đỉnh dist nhỏ nhất; relax cạnh kề · khác MST (tối ưu path, không tập cạnh cây)</text>

</svg>