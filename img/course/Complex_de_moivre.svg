<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="De Moivre theorem visualization">
  <rect width="720" height="400" fill="#fafbfc"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">De Moivre — lũy thừa trên đường tròn</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#5c6370">zⁿ = ρⁿ (cos nθ + i sin nθ) — góc nhân n, bán kính lũy thừa n</text>
  <defs><marker id="arr-cdm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a1a2e"/></marker></defs>
  <line x1="120" y1="230" x2="460" y2="230" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr-cdm)"/>
  <line x1="280" y1="380" x2="280" y2="60" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arr-cdm)"/>
  <text x="468" y="235" font-size="14" fill="#1a1a2e">Re</text>
  <text x="288" y="52" font-size="14" fill="#1a1a2e">Im</text>
  <circle cx="280" cy="230" r="120" fill="none" stroke="#e8eaed" stroke-width="1.5"/>
  <line x1="280" y1="230" x2="357.9" y2="185.0" stroke="#004586" stroke-width="2" opacity="0.85"/>
  <circle cx="357.9" cy="185.0" r="5" fill="#004586"/>
  <text x="365.9" y="179.0" font-size="12" font-weight="600" fill="#004586">z (θ)</text>
  <line x1="280" y1="230" x2="340.0" y2="126.1" stroke="#15803d" stroke-width="2" opacity="0.85"/>
  <circle cx="340.0" cy="126.1" r="5" fill="#15803d"/>
  <text x="348.0" y="120.1" font-size="12" font-weight="600" fill="#15803d">z² (2θ)</text>
  <line x1="280" y1="230" x2="280.0" y2="80.0" stroke="#b42318" stroke-width="2" opacity="0.85"/>
  <circle cx="280.0" cy="80.0" r="5" fill="#b42318"/>
  <text x="288.0" y="74.0" font-size="12" font-weight="600" fill="#b42318">z³ (3θ)</text>
  <path d="M 308 230 A 28 28 0 0 0 304.2 216.0" fill="none" stroke="#004586" stroke-width="2"/>
  <text x="314" y="220" font-size="12" fill="#004586">θ</text>
  <rect x="500" y="100" width="200" height="160" rx="8" fill="#fff" stroke="#e8eaed" stroke-width="1.5"/>
  <text x="600" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">Hệ quả</text>
  <text x="515" y="158" font-size="12" fill="#1a1a2e">|zⁿ| = |z|ⁿ = ρⁿ</text>
  <text x="515" y="185" font-size="12" fill="#1a1a2e">arg(zⁿ) = n · arg(z)</text>
  <text x="515" y="220" font-size="12" fill="#1a1a2e">Dùng cho rⁿ khi r phức</text>
  <text x="515" y="245" font-size="12" fill="#5c6370">→ dạng sin / cos của HTTH</text>
</svg>