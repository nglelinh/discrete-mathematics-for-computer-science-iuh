<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Mealy Moore">
  <rect width="720" height="220" fill="#fafbfc"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Máy Mealy vs Moore</text>
  <rect x="40" y="50" width="300" height="150" rx="10" fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="190" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#004586">Mealy</text>
  <text x="190" y="105" text-anchor="middle" font-size="12" fill="#1a1a2e">Output gắn trên cạnh chuyển</text>
  <text x="190" y="130" text-anchor="middle" font-size="12" fill="#5c6370">δ(q, a) → (q′, y)</text>
  <rect x="380" y="50" width="300" height="150" rx="10" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#d97706">Moore</text>
  <text x="530" y="105" text-anchor="middle" font-size="12" fill="#1a1a2e">Output gắn trên trạng thái</text>
  <text x="530" y="130" text-anchor="middle" font-size="12" fill="#5c6370">λ(q) → y</text>
</svg>