<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-label="Directed graph">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .nt { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 15px; }
    .cap { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Đồ thị có hướng (digraph)</text>
  <line class="ea" x1="200" y1="140" x2="320" y2="100"/>
  <line class="ea" x1="360" y1="100" x2="480" y2="140"/>
  <line class="ea" x1="340" y1="120" x2="340" y2="220"/>
  <line class="ea" x1="220" y1="170" x2="300" y2="230"/>
  <line class="ea" x1="480" y1="170" x2="400" y2="230"/>
    <circle class="n" cx="180" cy="150" r="18"/>
  <text class="nt" x="180" y="155" text-anchor="middle">1</text>
    <circle class="n" cx="340" cy="90" r="18"/>
  <text class="nt" x="340" y="95" text-anchor="middle">2</text>
    <circle class="n" cx="500" cy="150" r="18"/>
  <text class="nt" x="500" y="155" text-anchor="middle">3</text>
    <circle class="n" cx="340" cy="250" r="18"/>
  <text class="nt" x="340" y="255" text-anchor="middle">4</text>
  <text class="l" x="140" y="120">deg⁺=2, deg⁻=0</text>
  <text class="l" x="360" y="70">deg⁺=1, deg⁻=1</text>
  <text class="l" x="520" y="120">deg⁺=1, deg⁻=1</text>
  <text class="l" x="360" y="295" text-anchor="middle">deg⁺=0, deg⁻=2</text>
  <text class="cap" x="360" y="325" text-anchor="middle">Cạnh có hướng (u,v): từ u đến v — ví dụ phụ thuộc module, call graph</text>

</svg>
