<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="Mealy Moore">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 13px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .acc { fill: white; stroke: #004586; stroke-width: 2.2; }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="180" y="28" text-anchor="middle" font-size="14" font-weight="600">Moore: ra theo trạng thái</text>
  <text class="t" x="520" y="28" text-anchor="middle" font-size="14" font-weight="600">Mealy: ra theo cạnh</text>
    <circle class="n" cx="120" cy="100" r="22"/>
  <text class="nt" x="120" y="105" text-anchor="middle">q/0</text>
    <circle class="n" cx="240" cy="100" r="22"/>
  <text class="nt" x="240" y="105" text-anchor="middle">p/1</text>
  <line class="e" x1="145" y1="100" x2="215" y2="100"/>
  <text class="l" x="170" y="90">a</text>
    <circle class="n" cx="460" cy="100" r="22"/>
  <text class="nt" x="460" y="105" text-anchor="middle">q</text>
    <circle class="n" cx="580" cy="100" r="22"/>
  <text class="nt" x="580" y="105" text-anchor="middle">p</text>
  <line class="e" x1="485" y1="100" x2="555" y2="100"/>
  <text class="l" x="500" y="90">a/1</text>
  <text class="cap" x="360" y="180" text-anchor="middle">Moore: λ(q) · Mealy: ω(q,a) · cùng sức mạnh transducer (với trễ đầu ra)</text>

</svg>