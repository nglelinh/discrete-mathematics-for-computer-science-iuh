<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Two ways to implement minimized function">
  <rect width="760" height="340" fill="#fafbfc"/>

  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Hai cách vẽ cùng hàm: xyz + xȳz</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#5c6370">Ra 1 khi (x=y=z=1) hoặc (x=z=1 và y=0)</text>

  <!-- Left: SOP -->
  <text x="190" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#004586">Cách 1 — SOP thô</text>
  <text x="50" y="110" font-size="12" font-weight="600">x</text>
  <text x="50" y="140" font-size="12" font-weight="600">y</text>
  <text x="50" y="170" font-size="12" font-weight="600">z</text>
  <line x1="70" y1="105" x2="130" y2="115" stroke="#004586" stroke-width="1.8"/>
  <line x1="70" y1="135" x2="130" y2="130" stroke="#004586" stroke-width="1.8"/>
  <line x1="70" y1="165" x2="130" y2="145" stroke="#004586" stroke-width="1.8"/>
  
  <path d="M130,112.0 L152.68,112.0 Q180.4,112.0 180.4,130 Q180.4,148.0 152.68,148.0 L130,148.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="151.168" y="135" text-anchor="middle" font-size="10" font-weight="600" fill="#004586">AND</text>
  <line x1="190" y1="130" x2="250" y2="145" stroke="#004586" stroke-width="1.8"/>
  <text x="210" y="120" font-size="11" fill="#5c6370">xyz</text>

  <text x="50" y="220" font-size="12" font-weight="600">x</text>
  <text x="50" y="250" font-size="12" font-weight="600">y</text>
  <text x="50" y="280" font-size="12" font-weight="600">z</text>
  <line x1="70" y1="245" x2="100" y2="245" stroke="#004586" stroke-width="1.8"/>
  
  <path d="M100,226.3 L126.17999999999999,245 L100,263.7 Z" fill="#fff" stroke="#004586" stroke-width="2"/>
  <circle cx="131.28" cy="245" r="4.25" fill="#fff" stroke="#004586" stroke-width="2"/>
  <line x1="145" y1="245" x2="160" y2="245" stroke="#004586" stroke-width="1.8"/>
  <line x1="70" y1="215" x2="160" y2="230" stroke="#004586" stroke-width="1.8"/>
  <line x1="70" y1="275" x2="160" y2="260" stroke="#004586" stroke-width="1.8"/>
  
  <path d="M160,227.0 L182.68,227.0 Q210.4,227.0 210.4,245 Q210.4,263.0 182.68,263.0 L160,263.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="181.168" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#004586">AND</text>
  <line x1="220" y1="245" x2="250" y2="175" stroke="#004586" stroke-width="1.8"/>
  <text x="230" y="230" font-size="11" fill="#5c6370">xȳz</text>

  
  <path d="M250,139.0 Q270.3,139.0 281.9,139.0 Q308.0,139.0 308.0,160
           Q308.0,181.0 281.9,181.0 Q270.3,181.0 250,181.0
           Q260.44,160 250,139.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="277.84" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#004586">OR</text>
  <line x1="315" y1="160" x2="350" y2="160" stroke="#004586" stroke-width="2"/>
  <text x="190" y="310" text-anchor="middle" font-size="12" fill="#1a1a2e">2 AND + 1 OR + 1 NOT</text>

  <!-- Divider -->
  <line x1="380" y1="70" x2="380" y2="300" stroke="#e8eaed" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Right: minimized -->
  <text x="560" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#004586">Cách 2 — sau rút gọn</text>
  <text x="560" y="110" text-anchor="middle" font-size="15" fill="#1a1a2e">xyz + xȳz = (y + ȳ) xz = xz</text>
  <text x="460" y="180" font-size="14" font-weight="600">x</text>
  <text x="460" y="230" font-size="14" font-weight="600">z</text>
  <line x1="480" y1="175" x2="530" y2="190" stroke="#004586" stroke-width="2.5"/>
  <line x1="480" y1="225" x2="530" y2="210" stroke="#004586" stroke-width="2.5"/>
  
  <path d="M530,176.0 L560.24,176.0 Q597.2,176.0 597.2,200 Q597.2,224.0 560.24,224.0 L530,224.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="558.224" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#004586">AND</text>
  <line x1="605" y1="200" x2="680" y2="200" stroke="#004586" stroke-width="2.5"/>
  <text x="695" y="205" font-size="16" font-weight="600" fill="#1a1a2e">xz</text>
  <text x="560" y="280" text-anchor="middle" font-size="14" font-weight="600" fill="#004586">Chỉ 1 AND</text>
  <text x="560" y="310" text-anchor="middle" font-size="12" fill="#5c6370">Cùng bảng chân trị — ít cổng hơn rõ rệt</text>
</svg>