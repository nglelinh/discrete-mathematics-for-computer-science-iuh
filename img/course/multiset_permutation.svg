<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="260" viewBox="0 0 540 260">
  <title>Hoán vị đa tập — MISSISSIPPI</title>
  <rect width="540" height="260" fill="#ffffff"/>
  <text x="270" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Hoán vị đa tập: MISSISSIPPI</text>
  <text x="270" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Chữ giống nhau → hoán đổi không tạo từ mới → chia cho nᵢ!</text>

  <!-- letter tiles -->
  <g transform="translate(24, 70)">
    <rect x="0" y="0" width="36" height="44" rx="4" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="18" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">M</text>

    <rect x="44" y="0" width="36" height="44" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
    <text x="62" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">I</text>
    <rect x="88" y="0" width="36" height="44" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
    <text x="106" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">S</text>
    <rect x="132" y="0" width="36" height="44" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
    <text x="150" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">S</text>
    <rect x="176" y="0" width="36" height="44" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
    <text x="194" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">I</text>
    <rect x="220" y="0" width="36" height="44" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
    <text x="238" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">S</text>
    <rect x="264" y="0" width="36" height="44" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"/>
    <text x="282" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">S</text>
    <rect x="308" y="0" width="36" height="44" rx="4" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.5"/>
    <text x="326" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">I</text>
    <rect x="352" y="0" width="36" height="44" rx="4" fill="#faf089" stroke="#b7791f" stroke-width="1.5"/>
    <text x="370" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">P</text>
    <rect x="396" y="0" width="36" height="44" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/>
    <text x="414" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">I</text>
  </g>

  <!-- counts -->
  <text x="270" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13">n = 11 · M×1 · I×4 · S×4 · P×2</text>

  <!-- formula -->
  <rect x="60" y="165" width="420" height="70" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="270" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">11! hoán vị nếu đánh nhãn phân biệt</text>
  <text x="270" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">11! / (1! · 4! · 4! · 2!) = 34 650 từ khác nhau</text>
</svg>