  <rect x="144" y="70" width="64" height="64" fill="#dbeafe" stroke="#004586" stroke-width="1.5"/>
  <text x="176.0" y="108.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">1</text>
  <rect x="80" y="134" width="64" height="64" fill="#dbeafe" stroke="#004586" stroke-width="1.5"/>
  <text x="112.0" y="172.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">1</text>
