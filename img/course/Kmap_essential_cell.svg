  <text x="30" y="134" font-size="12" font-weight="600" fill="#15803d">T₂</text>
  <text x="240" y="230" text-anchor="middle" font-size="13" fill="#1a1a2e">Ô dưới-trái chỉ nằm trong T₂ → T₂ cốt yếu</text>
  <text x="240" y="255" text-anchor="middle" font-size="12" fill="#5c6370">= essential prime implicant (QM)</text>
