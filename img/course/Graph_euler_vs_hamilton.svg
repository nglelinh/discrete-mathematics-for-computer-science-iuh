<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Euler vs Hamilton">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .nt { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 15px; }
    .cap { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="200" y="30" text-anchor="middle" font-size="15" font-weight="600">Chu trình Euler</text>
  <text class="t" x="520" y="30" text-anchor="middle" font-size="15" font-weight="600">Chu trình Hamilton</text>
  <!-- Euler: cover every edge -->
  <line class="e" x1="120" y1="100" x2="280" y2="100" style="stroke:#004586;stroke-width:3"/>
  <line class="e" x1="280" y1="100" x2="280" y2="220" style="stroke:#004586;stroke-width:3"/>
  <line class="e" x1="280" y1="220" x2="120" y2="220" style="stroke:#004586;stroke-width:3"/>
  <line class="e" x1="120" y1="220" x2="120" y2="100" style="stroke:#004586;stroke-width:3"/>
  <line class="e" x1="120" y1="100" x2="280" y2="220" style="stroke:#004586;stroke-width:3"/>
    <circle class="n" cx="120" cy="100" r="18"/>
  <text class="nt" x="120" y="105" text-anchor="middle">A</text>
    <circle class="n" cx="280" cy="100" r="18"/>
  <text class="nt" x="280" y="105" text-anchor="middle">B</text>
    <circle class="n" cx="280" cy="220" r="18"/>
  <text class="nt" x="280" y="225" text-anchor="middle">C</text>
    <circle class="n" cx="120" cy="220" r="18"/>
  <text class="nt" x="120" y="225" text-anchor="middle">D</text>
  <text class="cap" x="200" y="265" text-anchor="middle">Đi qua mỗi cạnh đúng 1 lần</text>
  <text class="l" x="200" y="290" text-anchor="middle">Điều kiện: mọi bậc chẵn</text>
  <!-- Hamilton -->
  <line class="e" x1="440" y1="100" x2="600" y2="100"/>
  <line class="e" x1="600" y1="100" x2="600" y2="220"/>
  <line class="e" x1="600" y1="220" x2="440" y2="220"/>
  <line class="e" x1="440" y1="220" x2="440" y2="100"/>
  <line class="e" x1="440" y1="100" x2="600" y2="220"/>
  <line class="e" x1="440" y1="100" x2="600" y2="100" style="stroke:#004586;stroke-width:3"/>
  <line class="e" x1="600" y1="100" x2="600" y2="220" style="stroke:#004586;stroke-width:3"/>
  <line class="e" x1="600" y1="220" x2="440" y2="220" style="stroke:#004586;stroke-width:3"/>
  <line class="e" x1="440" y1="220" x2="440" y2="100" style="stroke:#004586;stroke-width:3"/>
    <circle class="n" cx="440" cy="100" r="18"/>
  <text class="nt" x="440" y="105" text-anchor="middle">A</text>
    <circle class="n" cx="600" cy="100" r="18"/>
  <text class="nt" x="600" y="105" text-anchor="middle">B</text>
    <circle class="n" cx="600" cy="220" r="18"/>
  <text class="nt" x="600" y="225" text-anchor="middle">C</text>
    <circle class="n" cx="440" cy="220" r="18"/>
  <text class="nt" x="440" y="225" text-anchor="middle">D</text>
  <text class="cap" x="520" y="265" text-anchor="middle">Đi qua mỗi đỉnh đúng 1 lần rồi về</text>
  <text class="l" x="520" y="290" text-anchor="middle">Không có điều kiện bậc đơn giản</text>

</svg>
