<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="landscape">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t{font-family:'Source Sans 3',Helvetica,Arial,sans-serif;fill:#1a2332}
    .l{font-family:'Source Sans 3',Helvetica,Arial,sans-serif;fill:#5a6570;font-size:12px}
    .nt{font-family:'Source Sans 3',Helvetica,Arial,sans-serif;fill:#004586;font-weight:700;font-size:13px}
    .cap{font-family:'Source Sans 3',Helvetica,Arial,sans-serif;fill:#5a6570;font-size:11px}
  </style>

  <text class="t" x="400" y="24" text-anchor="middle" font-size="14" font-weight="600">Phác đồ lớp phức tạp (rút gọn, quan hệ giả định P≠NP)</text>
  <ellipse cx="400" cy="170" rx="280" ry="130" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text class="l" x="620" y="80">PSPACE</text>
  <ellipse cx="400" cy="175" rx="210" ry="95" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="l" x="560" y="110">PH / NP</text>
  <ellipse cx="360" cy="185" rx="90" ry="50" fill="#e8f1fb" stroke="#004586" stroke-width="2"/>
  <text class="nt" x="360" y="190" text-anchor="middle">P</text>
  <ellipse cx="470" cy="160" rx="55" ry="35" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text class="l" x="470" y="165" text-anchor="middle">NPC</text>
  <text class="cap" x="400" y="320" text-anchor="middle">P ⊆ NP ⊆ PH ⊆ PSPACE ⊆ EXP · NPC “khó nhất” trong NP theo ≤ₚ</text>

</svg>