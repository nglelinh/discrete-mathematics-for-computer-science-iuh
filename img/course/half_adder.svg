<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Half adder">
  <rect width="520" height="230" fill="#fafbfc"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Mạch Half Adder</text>
  <text x="30" y="95" font-size="14" fill="#1a1a2e">A</text><text x="30" y="155" font-size="14" fill="#1a1a2e">B</text>
  <line x1="50" y1="90" x2="130" y2="90" stroke="#004586" stroke-width="2"/>
  <line x1="50" y1="150" x2="130" y2="150" stroke="#004586" stroke-width="2"/>
  <rect x="130" y="65" width="80" height="50" rx="6" fill="#dbeafe" stroke="#004586" stroke-width="2"/>
  <text x="170" y="95" text-anchor="middle" font-size="14" font-weight="600">XOR</text>
  <rect x="130" y="125" width="80" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="170" y="155" text-anchor="middle" font-size="14" font-weight="600">AND</text>
  <line x1="210" y1="90" x2="350" y2="90" stroke="#004586" stroke-width="2"/>
  <line x1="210" y1="150" x2="350" y2="150" stroke="#004586" stroke-width="2"/>
  <text x="380" y="95" font-size="14" fill="#1a1a2e">Sum</text>
  <text x="380" y="155" font-size="14" fill="#1a1a2e">Carry</text>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#5c6370">Sum = A ⊕ B · Carry = A ∧ B</text>
</svg>