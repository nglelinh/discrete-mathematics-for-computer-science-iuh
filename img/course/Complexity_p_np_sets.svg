<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="P NP">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 13px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>

  <text class="t" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">P ⊆ NP — có P = NP hay không là câu hỏi mở</text>
  <circle cx="360" cy="160" r="120" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text class="nt" x="360" y="70" text-anchor="middle">NP</text>
  <circle cx="360" cy="170" r="70" fill="#e8f1fb" stroke="#004586" stroke-width="2"/>
  <text class="nt" x="360" y="175" text-anchor="middle">P</text>
  <text class="l" x="500" y="120">kiểm tra certificate</text>
  <text class="l" x="500" y="140">đa thức</text>
  <text class="l" x="200" y="250" text-anchor="middle">giải đa thức</text>
  <text class="cap" x="360" y="310" text-anchor="middle">NP-complete: “khó nhất” trong NP (theo rút gọn đa thức)</text>

</svg>