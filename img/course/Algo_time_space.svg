<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Time space">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 13px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>

  <text class="t" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Phân tích độ phức tạp</text>
  <rect class="box" x="60" y="55" width="280" height="130" rx="8"/>
  <text class="nt" x="200" y="90" text-anchor="middle">Thời gian T(n)</text>
  <text class="l" x="90" y="120">best / average / worst</text>
  <text class="l" x="90" y="145">thường quan tâm worst-case</text>
  <rect class="box" x="380" y="55" width="280" height="130" rx="8"/>
  <text class="nt" x="520" y="90" text-anchor="middle">Không gian S(n)</text>
  <text class="l" x="410" y="120">bộ nhớ phụ (auxiliary)</text>
  <text class="l" x="410" y="145">in-place vs O(n) buffer</text>
  <text class="cap" x="360" y="220" text-anchor="middle">Cùng bài toán: so sánh T(n) bằng Big-O / Θ — không đo mili-giây máy cụ thể</text>

</svg>