<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-52 -89 249 166">
 <title>Euler diagram of number sets</title>
 <desc>Euler diagram of selected number sets (assuming transcendental numbers are real) by CMG Lee. Bold numbers denote only numbers in their regions. Italics denote examples in each region. In the SVG file, hover over a set to highlight it.</desc>
 <style type="text/css">
#main { font-family:Helvetica,Arial,sans-serif; font-size:10px; text-anchor:middle;
        fill:#000000; stroke:#000000; stroke-opacity:0.75; stroke-width:0.8; stroke-linecap:round; }
#main:hover   { stroke-opacity:0.1; fill-opacity:0.2; }
.nofade       { stroke-opacity:1;   fill-opacity:1;   }
.active:hover { stroke-opacity:1;   fill-opacity:0.9; }
text          { stroke:none; cursor:default; }
rect, path    { fill:none; }
.leader       { stroke-width:0.5; }
.start        { text-anchor:start; }
.end          { text-anchor:end; }
.fixed        { font-size:18px; font-weight:bold; }
.example      { font-size:16px; font-style:italic; }
#zero              { fill:#000000; stroke:#000000; }
#odd               { fill:#ff3300; stroke:#ff3300; stroke-dasharray:1,1; }
#even              { fill:#ff9900; stroke:#ff9900; stroke-dasharray:2,1; }
#prime             { fill:#0099cc; stroke:#0099cc; stroke-dasharray:2,1,2,1,0.1,1; }
#composite         { fill:#00ccff; stroke:#00ccff; stroke-dasharray:2,1,0.1,1,0.1,1; }
#natural           { fill:#cc9966; stroke:#cc9966; }
#whole             { fill:#999999; stroke:#999999; }
#integer           { fill:#6666cc; stroke:#6666cc; }
#negative_number   { fill:#333333; stroke:#333333; stroke-dasharray:2,1,0.1,1; }
#rational          { fill:#cc0000; stroke:#cc0000; }
#irrational        { fill:#990000; stroke:#990000; stroke-dasharray:8,1; }
#algebraic_real    { fill:#0000ff; stroke:#0000ff; }
#transcendental    { fill:#000099; stroke:#000099; stroke-dasharray:4,1; }
#real              { fill:#ff0000; stroke:#ff0000; }
#extended_real     { fill:#ff0099; stroke:#ff0099; stroke-dasharray:4,2; }
#gaussian_integer  { fill:#00cc00; stroke:#00cc00; }
#gaussian_rational { fill:#cccc00; stroke:#cccc00; }
#algebraic         { fill:#ffcc00; stroke:#ffcc00; }
#purely_imaginary  { fill:#ff99cc; stroke:#ff99cc; stroke-dasharray:6,2; }
#complex           { fill:#0099cc; stroke:#0099cc; }
 </style>
 <g id="main">
  <g class="nofade">
   <circle cx="0" cy="0" r="9999" fill="#ffffff"/>
   <text transform="translate(165,  0)" y="0.7ex" class="fixed"><tspan x="0" y="0">&#8722;&#8734;</tspan><tspan x="0" y="1.5ex">+&#8734;</tspan></text>
   <text transform="translate(  0,  0)" y="0.7ex" class="fixed">0</text>
   <text transform="translate( 20,-10)" y="0.7ex" class="fixed">1</text>
   <text transform="translate( 26, 10)" y="0.7ex" class="fixed">2</text>
   <text transform="translate( 32,-10)" y="0.7ex" class="example">3</text>
   <text transform="translate( 46, 10)" y="0.7ex" class="example">4</text>
   <text transform="translate( 46,-10)" y="0.7ex" class="example">9</text>
   <text transform="translate( 63,-10)" y="0.7ex" class="example"><tspan>&#8722;</tspan><tspan dx="-0.3ex">1</tspan></text>
   <text transform="translate( 63, 10)" y="0.7ex" class="example"><tspan>&#8722;</tspan><tspan dx="-0.3ex">2</tspan></text>
   <text transform="translate( 86,-10)" y="0.7ex" class="example"><tspan x="0" y="1ex">1</tspan><tspan x="0.2ex">_</tspan><tspan x="-1.1ex" font-size="13">_</tspan><tspan x="0" dy="1em">2</tspan></text>
   <text transform="translate( 98,-10)" y="0.7ex" class="example"><tspan x="0" y="1ex">1</tspan><tspan x="0.2ex">_</tspan><tspan x="0" dy="1em">2</tspan></text>
   <text transform="translate(117,  0)" y="0.7ex" class="example"><tspan>&#8730;</tspan><tspan dx="-0.2ex">2</tspan></text>
   <text transform="translate(140,  0)" y="0.7ex" class="example">e</text>
   <text transform="translate(100,-55)" y="0.7ex" class="example">e+&#960;i</text>
   <text transform="translate( -7,-54)" y="0.7ex" class="example">&#960;i</text>
   <text transform="translate( -4,-36)" y="0.7ex" class="example">i</text>
   <text transform="translate( 45,-36)" y="0.7ex" class="example">1+2i</text>
   <text transform="translate( 87,-36)" y="0.7ex" class="example"><tspan>1</tspan><tspan dx="-0.4ex">.</tspan><tspan dx="-0.1ex">2&#8722;i</tspan></text>
   <text transform="translate(118,-36)" y="0.7ex" class="example"><tspan>i&#8730;</tspan><tspan dx="-0.2ex">2</tspan></text>
   <text transform="translate(164,-55)" y="0.7ex" class="example"><tspan>0</tspan><tspan x="0.2ex">_</tspan><tspan x="0" dy="1em">0</tspan></text>
  </g>
  <g id="complex"           class="active"><text transform="translate(140,-73)" y="0.7ex" class="start"><tspan>Complex, C</tspan><tspan dx="-1.6ex">C</tspan></text><rect x="-22" y="-64" width="174" height="96" rx="14" ry="14"/><path class="leader" d="M 137,-64 L 141,-69"/></g>
  <g id="purely_imaginary"  class="active"><text transform="translate( 30,-73)" y="0.7ex" class="end">Purely imaginary</text><rect x="-21" y="-63" width="32" height="94" rx="13" ry="13"/><path class="leader" d="M -11,-63 L -15,-69"/></g>
  <g id="algebraic"         class="active"><text transform="translate(133,-73)" y="0.7ex" class="end"><tspan>Algebraic, A</tspan><tspan dx="-1.5ex">A</tspan></text><rect x="-20" y="-46" width="151" height="76" rx="12" ry="12"/><path class="leader" d="M 120,-46 L 124,-69"/></g>
  <g id="gaussian_rational" class="active"><text transform="translate( 70,-84)" y="0.7ex" class="start">Gaussian rational</text><rect x="-19" y="-45" width="126" height="74" rx="11" ry="11"/><path class="leader" d="M 80,-45 L 72,-79"/></g>
  <g id="gaussian_integer"  class="active"><text transform="translate( 60,-84)" y="0.7ex" class="end">Gaussian integer</text><rect x="-18" y="-44" width="92" height="72" rx="10" ry="10"/><path class="leader" d="M 67,-44 L 58,-79"/></g>
  <g id="extended_real"     class="active"><text transform="translate(130, 50)" y="0.7ex" class="start">Extended real</text><rect x="-17" y="-27" width="195" height="54" rx="9" ry="9"/><path class="leader" d="M 171,27 L 183,47"/></g>
  <g id="real"              class="active"><text transform="translate(135, 40)" y="0.7ex" class="start"><tspan>Real, R</tspan><tspan dx="-1.6ex">R</tspan></text><rect x="-16" y="-26" width="167" height="52" rx="8" ry="8"/><path class="leader" d="M 145,26 L 150,35"/></g>
  <g id="transcendental"    class="active"><text transform="translate(120, 60)" y="0.7ex" class="start">Transcendental</text><path d="M 130,-25 H 143 a 7,7 0 0 1 7,7 V 18 a 7,7 0 0 1 -7,7 H 130 Z"/><path class="leader" d="M 130,25 L 123,55"/></g>
  <g id="algebraic_real"    class="active"><text transform="translate(111, 70)" y="0.7ex" class="start"><tspan>Algebraic real, A</tspan><tspan dx="-1.5ex">A</tspan><tspan dy="0.5ex">R</tspan></text><path d="M 129,-25 H -8 a 7,7 0 0 0 -7,7 V 18 a 7,7 0 0 0  7,7 H 129 Z"/><path class="leader" d="M 129,25 L 115,65"/></g>
  <g id="irrational"        class="active"><text transform="translate(103, 70)" y="0.7ex" class="end">Irrational</text><path d="M 106,-24 H 143 a 6,6 0 0 1 6,6 V 18 a 6,6 0 0 1 -6,6 H 106 Z"/><path class="leader" d="M 106,23 L 102,65"/></g>
  <g id="rational"          class="active"><text transform="translate(100, 60)" y="0.7ex" class="end"><tspan>Rational, Q</tspan><tspan dx="-1.8ex">Q</tspan></text><path d="M 105,-24 H -8 a 6,6 0 0 0 -6,6 V 18 a 6,6 0 0 0  6,6 H 105 Z"/><path class="leader" d="M 105,23 L 96,55"/></g>
  <g id="negative_number"   class="active"><text transform="translate( 75, 40)" y="0.7ex"><tspan>Negative</tspan><tspan x="0" dy="0.8em">number</tspan></text><path d="M 56,-22 H 89 a 4,4 0 0 1 4,4 V 18 a 4,4 0 0 1 -4,4 H 56 Z"/><path class="leader" d="M 90,22 L 75,35"/></g>
  <g id="integer"           class="active"><text transform="translate( 25, 60)" y="0.7ex"><tspan>Integer,</tspan><tspan x="0" dy="1em">Z</tspan><tspan dx="-1.5ex">Z</tspan></text><rect x="-13" y="-23" width="86" height="46" rx="5" ry="5"/><path class="leader" d="M 70,23 L 25,55"/></g>
  <g id="whole"             class="active"><text transform="translate(  2, 70)" y="0.7ex" class="end"><tspan>Whole, N</tspan><tspan dx="-1.6ex">N</tspan><tspan dy="0.5ex">0</tspan></text><path d="M 55,-22 H -8 a 4,4 0 0 0 -4,4 V 18 a 4,4 0 0 0 4,4 H 55 Z"/><path class="leader" d="M 55,22 L -8,65"/></g>
  <g id="natural"           class="active"><text transform="translate(  0, 55)" y="0.7ex" class="end"><tspan>Natural, N</tspan><tspan dx="-1.6ex">N*</tspan></text><rect x="12" y="-20" width="42" height="40"/><path class="leader" d="M 54,20 L 0,55"/></g>
  <g id="composite"         class="active"><text transform="translate( -1, 40)" y="0.7ex" class="end">Composite</text><rect x="40" y="-19" width="13" height="38"/><path class="leader" d="M 40,19 L 0,40"/></g>
  <g id="prime"             class="active"><text transform="translate(-23, 30)" y="0.7ex" class="end">Prime</text><path d="M 39,-19 H 28 a 2,2 0,0,0 -2,2 V 0 a 2,2 0 0 1 -2,2 H 13 V 19 H 39 Z"/><path class="leader" d="M 13,19 L -22,30"/></g>
  <g id="even"              class="active"><text transform="translate(-26,-30)" y="0.7ex" class="end">Even</text><path d="M 72,1 V 18 a 3,3 0 0 1 -3,3 H -8 a 3,3 0 0 1 -3,-3 V -18 a 3,3 0 0 1 3,-3 H 13 V -2 a 3,3 0 0 0 3,3 Z"/><path class="leader" d="M 13,0 L -25,-30"/></g>
  <g id="odd"               class="active"><text transform="translate(-26,-40)" y="0.7ex" class="end">Odd</text><path  d="M 72,0 V -18 a 3,3 0 0 0 -3,-3 H 14 V -2 a 2,2 0 0 0 2,2 Z"/><path class="leader" d="M 14,-2 L -25,-40"/></g>
  <g id="zero"              class="active"><text transform="translate(-26,  0)" y="0.7ex" class="end">Zero</text><path d="M 10,-20 H -8 a 2,2 0 0 0 -2,2 V 18 a 2,2 0 0 0 2,2 H 10 Z"/><path class="leader" d="M -10,0 H -25"/></g>
 </g>
</svg>
