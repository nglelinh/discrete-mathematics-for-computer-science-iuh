<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Circuit to expression">
  <rect width="760" height="350" fill="#fafbfc"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Đọc mạch → biểu thức</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#5c6370">Ghi nhãn từng dây từ trái sang phải</text>

  <text x="40" y="100" font-size="14" font-weight="600" fill="#1a1a2e">A</text>
  <text x="40" y="170" font-size="14" font-weight="600" fill="#1a1a2e">B</text>
  <text x="40" y="250" font-size="14" font-weight="600" fill="#1a1a2e">C</text>

  <!-- buses -->
  <line x1="60" y1="95" x2="60" y2="95" stroke="#004586" stroke-width="2"/>
  <line x1="60" y1="95" x2="120" y2="95" stroke="#004586" stroke-width="2"/>
  <line x1="60" y1="165" x2="200" y2="165" stroke="#004586" stroke-width="2"/>
  <line x1="60" y1="245" x2="120" y2="245" stroke="#004586" stroke-width="2"/>

  <!-- NOT A -->
  
  <path d="M120,73.0 L150.8,95 L120,117.0 Z" fill="#fff" stroke="#004586" stroke-width="2"/>
  <circle cx="156.8" cy="95" r="5.0" fill="#fff" stroke="#004586" stroke-width="2"/>
  <line x1="165" y1="95" x2="220" y2="110" stroke="#004586" stroke-width="2"/>
  <text x="175" y="85" font-size="11" fill="#5c6370">Ā</text>

  <!-- B to top OR -->
  <line x1="60" y1="165" x2="100" y2="165" stroke="#004586" stroke-width="2"/>
  <line x1="100" y1="165" x2="100" y2="130" stroke="#004586" stroke-width="2"/>
  <line x1="100" y1="130" x2="220" y2="130" stroke="#004586" stroke-width="2"/>

  
  <path d="M220,99.0 Q240.3,99.0 251.9,99.0 Q278.0,99.0 278.0,120
           Q278.0,141.0 251.9,141.0 Q240.3,141.0 220,141.0
           Q230.44,120 220,99.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="247.84" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#004586">OR</text>
  <line x1="285" y1="120" x2="400" y2="130" stroke="#004586" stroke-width="2"/>
  <text x="320" y="110" font-size="11" fill="#5c6370">Ā+B</text>

  <!-- middle OR: A, B, C -->
  <line x1="60" y1="95" x2="90" y2="95" stroke="#004586" stroke-width="2"/>
  <line x1="90" y1="95" x2="90" y2="190" stroke="#004586" stroke-width="2"/>
  <line x1="90" y1="190" x2="220" y2="190" stroke="#004586" stroke-width="2"/>
  <line x1="100" y1="165" x2="220" y2="200" stroke="#004586" stroke-width="2"/>
  <line x1="60" y1="245" x2="150" y2="245" stroke="#004586" stroke-width="2"/>
  <line x1="150" y1="245" x2="150" y2="210" stroke="#004586" stroke-width="2"/>
  <line x1="150" y1="210" x2="220" y2="210" stroke="#004586" stroke-width="2"/>
  
  <path d="M220,179.0 Q240.3,179.0 251.9,179.0 Q278.0,179.0 278.0,200
           Q278.0,221.0 251.9,221.0 Q240.3,221.0 220,221.0
           Q230.44,200 220,179.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="247.84" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#004586">OR</text>
  <line x1="285" y1="200" x2="400" y2="155" stroke="#004586" stroke-width="2"/>
  <text x="320" y="215" font-size="11" fill="#5c6370">A+B+C</text>

  <!-- NOT C -->
  
  <path d="M120,223.0 L150.8,245 L120,267.0 Z" fill="#fff" stroke="#004586" stroke-width="2"/>
  <circle cx="156.8" cy="245" r="5.0" fill="#fff" stroke="#004586" stroke-width="2"/>
  <line x1="165" y1="245" x2="400" y2="180" stroke="#004586" stroke-width="2"/>
  <text x="185" y="270" font-size="11" fill="#5c6370">C̄</text>

  
  <path d="M400,132.0 L428.98,132.0 Q464.4,132.0 464.4,155 Q464.4,178.0 428.98,178.0 L400,178.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="427.048" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#004586">AND</text>
  <line x1="470" y1="155" x2="560" y2="155" stroke="#004586" stroke-width="2.5"/>
  <text x="575" y="160" font-size="16" font-weight="600" fill="#1a1a2e">Y</text>

  <rect x="120" y="290" width="520" height="40" rx="8" fill="#dbeafe" stroke="#004586"/>
  <text x="380" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Y = (Ā + B)(A + B + C) C̄</text>
</svg>