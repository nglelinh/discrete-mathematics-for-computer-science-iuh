<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="2-to-4 decoder">
  <rect width="640" height="300" fill="#fafbfc"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Decoder 2-to-4</text>
  <text x="40" y="110" font-size="14" fill="#1a1a2e">A₁</text>
  <text x="40" y="160" font-size="14" fill="#1a1a2e">A₀</text>
  <line x1="70" y1="105" x2="180" y2="120" stroke="#004586" stroke-width="2"/>
  <line x1="70" y1="155" x2="180" y2="160" stroke="#004586" stroke-width="2"/>
  <rect x="180" y="70" width="140" height="140" rx="10" fill="#fff" stroke="#004586" stroke-width="2.5"/>
  <text x="250" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#004586">DEC</text>
  <text x="250" y="170" text-anchor="middle" font-size="12" fill="#5c6370">2 → 4</text>
  <line x1="320" y1="90" x2="420" y2="90" stroke="#004586" stroke-width="2"/>
  <text x="440" y="95" font-size="14" fill="#1a1a2e">Y0</text>
  <line x1="320" y1="120" x2="420" y2="120" stroke="#004586" stroke-width="2"/>
  <text x="440" y="125" font-size="14" fill="#1a1a2e">Y1</text>
  <line x1="320" y1="150" x2="420" y2="150" stroke="#004586" stroke-width="2"/>
  <text x="440" y="155" font-size="14" fill="#1a1a2e">Y2</text>
  <line x1="320" y1="180" x2="420" y2="180" stroke="#004586" stroke-width="2"/>
  <text x="440" y="185" font-size="14" fill="#1a1a2e">Y3</text>
  <text x="320" y="250" text-anchor="middle" font-size="13" fill="#1a1a2e">Đúng một Yᵢ = 1 khi (A₁A₀)₂ = i</text>
  <text x="320" y="275" text-anchor="middle" font-size="12" fill="#5c6370">Yᵢ = minterm mᵢ — nền tảng ROM / chọn thanh ghi</text>
</svg>