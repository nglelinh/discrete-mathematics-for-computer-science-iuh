<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="BST example">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 14px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">BST — trái &lt; gốc &lt; phải</text>
  <line class="e" x1="360" y1="80" x2="220" y2="150"/>
  <line class="e" x1="360" y1="80" x2="500" y2="150"/>
  <line class="e" x1="220" y1="170" x2="140" y2="250"/>
  <line class="e" x1="220" y1="170" x2="280" y2="250"/>
  <line class="e" x1="500" y1="170" x2="440" y2="250"/>
  <line class="e" x1="500" y1="170" x2="560" y2="250"/>
    <circle class="n" cx="360" cy="70" r="18"/>
  <text class="nt" x="360" y="75" text-anchor="middle">8</text>
    <circle class="n" cx="220" cy="160" r="18"/>
  <text class="nt" x="220" y="165" text-anchor="middle">3</text>
    <circle class="n" cx="500" cy="160" r="18"/>
  <text class="nt" x="500" y="165" text-anchor="middle">10</text>
    <circle class="n" cx="140" cy="260" r="18"/>
  <text class="nt" x="140" y="265" text-anchor="middle">1</text>
    <circle class="n" cx="280" cy="260" r="18"/>
  <text class="nt" x="280" y="265" text-anchor="middle">6</text>
    <circle class="n" cx="440" cy="260" r="18"/>
  <text class="nt" x="440" y="265" text-anchor="middle">9</text>
    <circle class="n" cx="560" cy="260" r="18"/>
  <text class="nt" x="560" y="265" text-anchor="middle">14</text>
  <text class="l" x="60" y="300">Inorder: 1, 3, 6, 8, 9, 10, 14 — tăng dần</text>
  <text class="cap" x="360" y="330" text-anchor="middle">Tìm kiếm / chèn O(h); worst O(n) nếu cây lệch</text>

</svg>
