<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Cổng AND">
  <rect width="400" height="210" fill="#fafbfc"/>
  <text x="200" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Cổng AND</text>
  <text x="200" y="48" text-anchor="middle" font-size="12" fill="#5c6370">Ra 1 chỉ khi mọi ngõ vào = 1</text>
  <text x="70" y="92" text-anchor="end" font-size="14" font-weight="600" fill="#1a1a2e">A</text>
  <text x="70" y="138" text-anchor="end" font-size="14" font-weight="600" fill="#1a1a2e">B</text>
  <line x1="80" y1="92" x2="130" y2="96" stroke="#004586" stroke-width="2.5"/>
  <line x1="80" y1="128" x2="130" y2="124" stroke="#004586" stroke-width="2.5"/>

  <path d="M130,83.0 L164.02,83.0 Q205.60000000000002,83.0 205.60000000000002,110 Q205.60000000000002,137.0 164.02,137.0 L130,137.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="161.752" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#004586">AND</text>
  <line x1="220" y1="110" x2="270" y2="110" stroke="#004586" stroke-width="2.5"/>
