<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Blockchain">
  <rect width="800" height="280" fill="#fafbfc"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Chuỗi khối (blockchain)</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#5c6370">Mỗi khối tham chiếu hash khối trước — proof-of-work</text>
  <rect x="40" y="100" width="150" height="90" rx="8" fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="115" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Block 0</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#5c6370">Genesis</text>
  <line x1="190" y1="145" x2="230" y2="145" stroke="#004586" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="230" y="100" width="150" height="90" rx="8" fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="305" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Block 1</text>
  <text x="305" y="160" text-anchor="middle" font-size="11" fill="#5c6370">hash₀</text>
  <line x1="380" y1="145" x2="420" y2="145" stroke="#004586" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="420" y="100" width="150" height="90" rx="8" fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="495" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Block 2</text>
  <text x="495" y="160" text-anchor="middle" font-size="11" fill="#5c6370">hash₁</text>
  <line x1="570" y1="145" x2="610" y2="145" stroke="#004586" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="610" y="100" width="150" height="90" rx="8" fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="685" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Block 3</text>
  <text x="685" y="160" text-anchor="middle" font-size="11" fill="#5c6370">hash₂</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#004586"/></marker></defs>
  <text x="400" y="250" text-anchor="middle" font-size="13" fill="#5c6370">Sửa một khối → phá vỡ toàn bộ chuỗi hash phía sau</text>
</svg>