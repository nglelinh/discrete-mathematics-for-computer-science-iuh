<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-label="Topo DAG">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 14px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">DAG và topological order</text>
  <line class="ea" x1="120" y1="100" x2="240" y2="160"/>
  <line class="ea" x1="120" y1="100" x2="240" y2="240"/>
  <line class="ea" x1="260" y1="160" x2="400" y2="200"/>
  <line class="ea" x1="260" y1="240" x2="400" y2="200"/>
  <line class="ea" x1="420" y1="200" x2="560" y2="200"/>
    <circle class="n" cx="100" cy="100" r="18"/>
  <text class="nt" x="100" y="105" text-anchor="middle">P</text>
    <circle class="n" cx="250" cy="160" r="18"/>
  <text class="nt" x="250" y="165" text-anchor="middle">Q</text>
    <circle class="n" cx="250" cy="240" r="18"/>
  <text class="nt" x="250" y="245" text-anchor="middle">R</text>
    <circle class="n" cx="410" cy="200" r="18"/>
  <text class="nt" x="410" y="205" text-anchor="middle">S</text>
    <circle class="n" cx="580" cy="200" r="18"/>
  <text class="nt" x="580" y="205" text-anchor="middle">T</text>
  <text class="l" x="60" y="300">Topo hợp lệ: P, Q, R, S, T  hoặc  P, R, Q, S, T</text>
  <text class="cap" x="360" y="325" text-anchor="middle">Mọi cạnh u→v: u đứng trước v · có chu trình ⇔ không có topo sort</text>

</svg>