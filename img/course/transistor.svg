<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Transistor">
  <rect width="400" height="230" fill="#fafbfc"/>

  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Transistor NPN</text>
