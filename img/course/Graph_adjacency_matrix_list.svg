<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Adjacency representations">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .nt { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 15px; }
    .cap { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Hai cách biểu diễn cùng một đồ thị</text>
  <!-- small graph -->
  <line class="e" x1="80" y1="100" x2="160" y2="80"/>
  <line class="e" x1="80" y1="100" x2="140" y2="160"/>
  <line class="e" x1="160" y1="80" x2="140" y2="160"/>
  <line class="e" x1="140" y1="160" x2="200" y2="140"/>
    <circle class="n" cx="80" cy="100" r="16"/>
  <text class="nt" x="80" y="105" text-anchor="middle">0</text>
    <circle class="n" cx="160" cy="80" r="16"/>
  <text class="nt" x="160" y="85" text-anchor="middle">1</text>
    <circle class="n" cx="140" cy="160" r="16"/>
  <text class="nt" x="140" y="165" text-anchor="middle">2</text>
    <circle class="n" cx="200" cy="140" r="16"/>
  <text class="nt" x="200" y="145" text-anchor="middle">3</text>
  <!-- matrix -->
  <text class="t" x="400" y="70" text-anchor="middle" font-size="14" font-weight="600">Ma trận kề A</text>
  <text class="l" x="340" y="95">  0 1 2 3</text>
  <text class="l" x="320" y="118">0</text>
  <text class="l" x="320" y="142">1</text>
  <text class="l" x="320" y="166">2</text>
  <text class="l" x="320" y="190">3</text>
  <rect class="box" x="340" y="100" width="120" height="100"/>
  <text class="nt" x="400" y="122" text-anchor="middle" font-size="13">0 1 1 0</text>
  <text class="nt" x="400" y="146" text-anchor="middle" font-size="13">1 0 1 0</text>
  <text class="nt" x="400" y="170" text-anchor="middle" font-size="13">1 1 0 1</text>
  <text class="nt" x="400" y="194" text-anchor="middle" font-size="13">0 0 1 0</text>
  <!-- list -->
  <text class="t" x="600" y="70" text-anchor="middle" font-size="14" font-weight="600">Danh sách kề</text>
  <rect class="hi" x="530" y="90" width="160" height="28" rx="4"/>
  <rect class="hi" x="530" y="124" width="160" height="28" rx="4"/>
  <rect class="hi" x="530" y="158" width="160" height="28" rx="4"/>
  <rect class="hi" x="530" y="192" width="160" height="28" rx="4"/>
  <text class="l" x="610" y="109" text-anchor="middle">0 → 1, 2</text>
  <text class="l" x="610" y="143" text-anchor="middle">1 → 0, 2</text>
  <text class="l" x="610" y="177" text-anchor="middle">2 → 0, 1, 3</text>
  <text class="l" x="610" y="211" text-anchor="middle">3 → 2</text>
  <text class="cap" x="360" y="250" text-anchor="middle">Ma trận: O(1) kiểm tra cạnh, O(n²) bộ nhớ · Danh sách: O(n+m) bộ nhớ, duyệt láng giềng O(deg)</text>

</svg>
