<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Complete and bipartite">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .nt { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 15px; }
    .cap { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="180" y="30" text-anchor="middle" font-size="15" font-weight="600">Đồ thị đầy đủ K₄</text>
  <text class="t" x="520" y="30" text-anchor="middle" font-size="15" font-weight="600">Đồ thị hai phía</text>
  <!-- K4 -->
  <line class="e" x1="120" y1="100" x2="240" y2="100"/>
  <line class="e" x1="120" y1="100" x2="120" y2="220"/>
  <line class="e" x1="240" y1="100" x2="240" y2="220"/>
  <line class="e" x1="120" y1="220" x2="240" y2="220"/>
  <line class="e" x1="120" y1="100" x2="240" y2="220"/>
  <line class="e" x1="240" y1="100" x2="120" y2="220"/>
    <circle class="n" cx="120" cy="100" r="18"/>
  <text class="nt" x="120" y="105" text-anchor="middle">1</text>
    <circle class="n" cx="240" cy="100" r="18"/>
  <text class="nt" x="240" y="105" text-anchor="middle">2</text>
    <circle class="n" cx="120" cy="220" r="18"/>
  <text class="nt" x="120" y="225" text-anchor="middle">3</text>
    <circle class="n" cx="240" cy="220" r="18"/>
  <text class="nt" x="240" y="225" text-anchor="middle">4</text>
  <text class="cap" x="180" y="270" text-anchor="middle">|E| = C(4,2) = 6</text>
  <!-- bipartite -->
  <line class="e" x1="440" y1="90" x2="600" y2="110"/>
  <line class="e" x1="440" y1="90" x2="600" y2="180"/>
  <line class="e" x1="440" y1="160" x2="600" y2="110"/>
  <line class="e" x1="440" y1="160" x2="600" y2="250"/>
  <line class="e" x1="440" y1="230" x2="600" y2="180"/>
    <circle class="n" cx="440" cy="90" r="18"/>
  <text class="nt" x="440" y="95" text-anchor="middle">A</text>
    <circle class="n" cx="440" cy="160" r="18"/>
  <text class="nt" x="440" y="165" text-anchor="middle">B</text>
    <circle class="n" cx="440" cy="230" r="18"/>
  <text class="nt" x="440" y="235" text-anchor="middle">C</text>
    <circle class="n" cx="600" cy="110" r="18"/>
  <text class="nt" x="600" y="115" text-anchor="middle">X</text>
    <circle class="n" cx="600" cy="180" r="18"/>
  <text class="nt" x="600" y="185" text-anchor="middle">Y</text>
    <circle class="n" cx="600" cy="250" r="18"/>
  <text class="nt" x="600" y="255" text-anchor="middle">Z</text>
  <text class="l" x="420" y="60">Tập A</text>
  <text class="l" x="590" y="80">Tập B</text>
  <text class="cap" x="520" y="295" text-anchor="middle">Cạnh chỉ nối A–B, không trong cùng một phía</text>

</svg>
