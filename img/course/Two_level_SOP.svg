<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Two-level SOP circuit">
  <rect width="780" height="350" fill="#fafbfc"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Mạch hai tầng SOP — F = A′B + AB′</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#5c6370">Tầng 1: AND (tích litera) · Tầng 2: OR (tổng) — cùng hành vi với XOR</text>

  <text x="40" y="100" font-size="14" font-weight="600" fill="#1a1a2e">A</text>
  <text x="40" y="200" font-size="14" font-weight="600" fill="#1a1a2e">B</text>

  <line x1="55" y1="95" x2="120" y2="95" stroke="#004586" stroke-width="2"/>
  <line x1="120" y1="70" x2="120" y2="165" stroke="#004586" stroke-width="2"/>
  <line x1="55" y1="195" x2="120" y2="195" stroke="#004586" stroke-width="2"/>
  <line x1="120" y1="125" x2="120" y2="230" stroke="#004586" stroke-width="2"/>

  <line x1="120" y1="70" x2="140" y2="70" stroke="#004586" stroke-width="2"/>
  
  <path d="M140,50.2 L167.72,70 L140,89.8 Z" fill="#fff" stroke="#004586" stroke-width="2"/>
  <circle cx="173.12" cy="70" r="4.5" fill="#fff" stroke="#004586" stroke-width="2"/>
  <line x1="185" y1="70" x2="250" y2="70" stroke="#004586" stroke-width="2"/>
  <line x1="250" y1="70" x2="250" y2="105" stroke="#004586" stroke-width="2"/>
  <text x="205" y="62" font-size="11" fill="#5c6370">A′</text>

  <line x1="120" y1="230" x2="140" y2="230" stroke="#004586" stroke-width="2"/>
  
  <path d="M140,210.2 L167.72,230 L140,249.8 Z" fill="#fff" stroke="#004586" stroke-width="2"/>
  <circle cx="173.12" cy="230" r="4.5" fill="#fff" stroke="#004586" stroke-width="2"/>
  <line x1="185" y1="230" x2="250" y2="230" stroke="#004586" stroke-width="2"/>
  <line x1="250" y1="230" x2="250" y2="185" stroke="#004586" stroke-width="2"/>
  <text x="205" y="248" font-size="11" fill="#5c6370">B′</text>

  <line x1="120" y1="125" x2="270" y2="125" stroke="#004586" stroke-width="2"/>
  <line x1="250" y1="105" x2="270" y2="105" stroke="#004586" stroke-width="2"/>
  
  <path d="M270,95.0 L295.2,95.0 Q326.0,95.0 326.0,115 Q326.0,135.0 295.2,135.0 L270,135.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="293.52" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#004586">AND</text>
  <line x1="336" y1="115" x2="410" y2="115" stroke="#004586" stroke-width="2"/>
  <text x="365" y="105" font-size="11" fill="#5c6370">A′B</text>

  <line x1="120" y1="165" x2="270" y2="165" stroke="#004586" stroke-width="2"/>
  <line x1="250" y1="185" x2="270" y2="185" stroke="#004586" stroke-width="2"/>
  
  <path d="M270,155.0 L295.2,155.0 Q326.0,155.0 326.0,175 Q326.0,195.0 295.2,195.0 L270,195.0 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="293.52" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#004586">AND</text>
  <line x1="336" y1="175" x2="410" y2="175" stroke="#004586" stroke-width="2"/>
  <text x="365" y="195" font-size="11" fill="#5c6370">AB′</text>

  <line x1="410" y1="115" x2="410" y2="130" stroke="#004586" stroke-width="2"/>
  <line x1="410" y1="175" x2="410" y2="160" stroke="#004586" stroke-width="2"/>
  
  <path d="M410,120.85 Q433.34499999999997,120.85 446.685,120.85 Q476.7,120.85 476.7,145
           Q476.7,169.15 446.685,169.15 Q433.34499999999997,169.15 410,169.15
           Q422.006,145 410,120.85 Z"
        fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="442.01599999999996" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#004586">OR</text>
  <line x1="480" y1="145" x2="560" y2="145" stroke="#004586" stroke-width="2"/>
  <text x="575" y="150" font-size="15" font-weight="600" fill="#1a1a2e">F</text>

  <rect x="600" y="95" width="150" height="100" rx="8" fill="#fff" stroke="#e8eaed" stroke-width="1.5"/>
  <text x="675" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Đếm thô</text>
  <text x="615" y="145" font-size="12" fill="#1a1a2e">2 NOT + 2 AND</text>
  <text x="615" y="165" font-size="12" fill="#1a1a2e">+ 1 OR</text>
  <text x="615" y="185" font-size="12" fill="#5c6370">depth ≈ 3 tầng</text>

  <text x="380" y="300" text-anchor="middle" font-size="13" fill="#1a1a2e">Tương đương macro XOR nếu thư viện có sẵn — cùng bảng chân trị, khác chi phí</text>
  <text x="380" y="325" text-anchor="middle" font-size="12" fill="#5c6370">SOP chuẩn → AND–OR · POS → OR–AND (đối ngẫu)</text>
</svg>