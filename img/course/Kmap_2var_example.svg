<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="K-map 2-var example">
  <rect width="440" height="300" fill="#fafbfc"/>

  <text x="220" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">K-map 2 biến — ví dụ</text>
  <text x="220" y="50" text-anchor="middle" font-size="12" fill="#5c6370">F = Σ m(0,1,3)  →  F = x′ + y</text>
  <text x="162" y="75" text-anchor="middle" font-size="12" fill="#5c6370">y=0　　y=1</text>
  <text x="82" y="126.0" text-anchor="end" font-size="12" fill="#5c6370">x=0</text>
  <text x="82" y="198.0" text-anchor="end" font-size="12" fill="#5c6370">x=1</text>
  <rect x="90" y="85" width="72" height="72" fill="#dbeafe" stroke="#004586" stroke-width="1.5"/>
  <text x="126.0" y="127.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">1</text>
  <rect x="162" y="85" width="72" height="72" fill="#dbeafe" stroke="#004586" stroke-width="1.5"/>
  <text x="198.0" y="127.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">1</text>
  <rect x="90" y="157" width="72" height="72" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="126.0" y="199.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">0</text>
  <rect x="162" y="157" width="72" height="72" fill="#dbeafe" stroke="#004586" stroke-width="1.5"/>
  <text x="198.0" y="199.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">1</text>
  <rect x="94" y="89" width="136" height="64" fill="none" stroke="#d97706" stroke-width="3" rx="10"/>
  <text x="162" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">x′</text>
  <rect x="166" y="89" width="64" height="136" fill="none" stroke="#15803d" stroke-width="3" rx="10"/>
  <text x="198.0" y="215" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">y</text>
  <text x="220" y="270" text-anchor="middle" font-size="13" fill="#1a1a2e">Nhóm hàng trên = x′ · nhóm cột phải = y</text>
</svg>