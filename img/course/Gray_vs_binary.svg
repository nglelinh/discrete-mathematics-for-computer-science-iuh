<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Gray vs binary order">
  <rect width="520" height="300" fill="#fafbfc"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Nhị phân thường vs mã Gray (2-bit)</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#5c6370">Thứ tự trục K-map phải chỉ đổi 1 bit mỗi bước</text>

  <rect x="40" y="70" width="200" height="160" rx="10" fill="#fff" stroke="#b42318" stroke-width="2"/>
  <text x="140" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#b42318">Nhị phân</text>
  <text x="140" y="130" text-anchor="middle" font-size="13" fill="#1a1a2e">00 → 01 → 10 → 11</text>
  <text x="140" y="160" text-anchor="middle" font-size="13" fill="#b42318">01 → 10 đổi 2 bit!</text>
  <text x="140" y="195" text-anchor="middle" font-size="12" fill="#5c6370">Không dùng làm trục K-map</text>

  <rect x="280" y="70" width="200" height="160" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">Gray</text>
  <text x="380" y="130" text-anchor="middle" font-size="13" fill="#1a1a2e">00 → 01 → 11 → 10</text>
  <text x="380" y="160" text-anchor="middle" font-size="13" fill="#15803d">mỗi bước đổi đúng 1 bit</text>
  <text x="380" y="195" text-anchor="middle" font-size="12" fill="#5c6370">Chuẩn hàng/cột K-map</text>

  <text x="260" y="270" text-anchor="middle" font-size="13" fill="#1a1a2e">Kề hình học trên lưới ⇔ kề Hamming (1 bit)</text>
</svg>