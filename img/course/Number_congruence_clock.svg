<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Congruence clock">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 14px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Đồng dư modulo 12 — “đồng hồ số học”</text>
  <circle cx="220" cy="175" r="100" fill="white" stroke="#004586" stroke-width="2"/>
  <text class="nt" x="220.0" y="102.0" text-anchor="middle">0</text>
  <text class="nt" x="259.0" y="112.5" text-anchor="middle">1</text>
  <text class="nt" x="287.5" y="141.0" text-anchor="middle">2</text>
  <text class="nt" x="298.0" y="180.0" text-anchor="middle">3</text>
  <text class="nt" x="287.5" y="219.0" text-anchor="middle">4</text>
  <text class="nt" x="259.0" y="247.5" text-anchor="middle">5</text>
  <text class="nt" x="220.0" y="258.0" text-anchor="middle">6</text>
  <text class="nt" x="181.0" y="247.5" text-anchor="middle">7</text>
  <text class="nt" x="152.5" y="219.0" text-anchor="middle">8</text>
  <text class="nt" x="142.0" y="180.0" text-anchor="middle">9</text>
  <text class="nt" x="152.5" y="141.0" text-anchor="middle">10</text>
  <text class="nt" x="181.0" y="112.5" text-anchor="middle">11</text>
  <line x1="220" y1="175" x2="275.0" y2="175.0" stroke="#004586" stroke-width="3"/>
  <circle cx="275.0" cy="175.0" r="8" fill="#004586"/>
  <rect class="hi" x="380" y="90" width="280" height="160" rx="10"/>
  <text class="t" x="520" y="120" text-anchor="middle" font-size="14" font-weight="600">a ≡ b (mod n)</text>
  <text class="l" x="400" y="150">⇔ n | (a − b)</text>
  <text class="l" x="400" y="175">⇔ a và b cùng số dư khi chia n</text>
  <text class="l" x="400" y="210">Ví dụ: 15 ≡ 3 (mod 12)</text>
  <text class="l" x="400" y="230">vì 15 − 3 = 12 = 1·12</text>
  <text class="cap" x="360" y="300" text-anchor="middle">Cộng/trừ/nhân trên đồng dư tương thích với phép toán số nguyên</text>

</svg>
