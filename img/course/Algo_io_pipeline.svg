<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="Algorithm IO">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 13px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>

  <text class="t" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Thuật toán: đầu vào → bước xác định → đầu ra</text>
  <rect class="hi" x="40" y="70" width="140" height="70" rx="8"/><text class="nt" x="110" y="110" text-anchor="middle">Input</text>
  <text class="t" x="200" y="110" font-size="20">→</text>
  <rect class="hi" x="230" y="70" width="260" height="70" rx="8"/><text class="nt" x="360" y="100" text-anchor="middle">Dãy bước hữu hạn</text><text class="l" x="360" y="120" text-anchor="middle">xác định · hiệu quả</text>
  <text class="t" x="510" y="110" font-size="20">→</text>
  <rect class="hi" x="540" y="70" width="140" height="70" rx="8"/><text class="nt" x="610" y="110" text-anchor="middle">Output</text>
  <text class="cap" x="360" y="180" text-anchor="middle">Đúng đắn (correctness) + dừng (finiteness) + không mơ hồ (definiteness)</text>

</svg>