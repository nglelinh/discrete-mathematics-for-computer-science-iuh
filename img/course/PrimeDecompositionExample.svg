<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Prime factorization">
  <rect width="520" height="300" fill="#fafbfc"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Phân tích thừa số nguyên tố</text>
  <text x="260" y="70" text-anchor="middle" font-size="20" font-weight="600" fill="#004586">60</text>
  <line x1="260" y1="78" x2="180" y2="110" stroke="#004586"/><line x1="260" y1="78" x2="340" y2="110" stroke="#004586"/>
  <text x="180" y="130" text-anchor="middle" font-size="16" fill="#1a1a2e">2</text>
  <text x="340" y="130" text-anchor="middle" font-size="16" fill="#1a1a2e">30</text>
  <line x1="340" y1="138" x2="280" y2="168" stroke="#004586"/><line x1="340" y1="138" x2="400" y2="168" stroke="#004586"/>
  <text x="280" y="188" text-anchor="middle" font-size="16">2</text>
  <text x="400" y="188" text-anchor="middle" font-size="16">15</text>
  <line x1="400" y1="196" x2="360" y2="226" stroke="#004586"/><line x1="400" y1="196" x2="440" y2="226" stroke="#004586"/>
  <text x="360" y="246" text-anchor="middle" font-size="16" fill="#16a34a">3</text>
  <text x="440" y="246" text-anchor="middle" font-size="16" fill="#16a34a">5</text>
  <text x="260" y="280" text-anchor="middle" font-size="13" fill="#5c6370">60 = 2² × 3 × 5</text>
</svg>