<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Compiler phases">
  <rect width="720" height="150" fill="#fafbfc"/>

