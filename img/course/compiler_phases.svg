  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Các giai đoạn biên dịch</text>
  <text x="50" y="80" font-size="13">source.c</text>
  <line x1="120" y1="75" x2="155" y2="75" stroke="#004586" marker-end="url(#arr)"/>
  <rect x="160" y="55" width="90" height="40" rx="6" fill="#dbeafe" stroke="#004586"/><text x="205" y="80" text-anchor="middle" font-size="12">Lexer</text>
  <line x1="250" y1="75" x2="285" y2="75" stroke="#004586" marker-end="url(#arr)"/>
  <text x="305" y="80" font-size="12">tokens</text>
