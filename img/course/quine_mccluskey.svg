<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Quine McCluskey">
  <rect width="520" height="210" fill="#fafbfc"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Quine–McCluskey — nhóm minterm</text>
  <rect x="60" y="50" width="80" height="30" fill="#004586"/><text x="100" y="70" text-anchor="middle" font-size="12" fill="#fff">#1</text>
  <rect x="160" y="50" width="120" height="30" fill="#004586"/><text x="220" y="70" text-anchor="middle" font-size="12" fill="#fff">Minterm</text>
  <rect x="60" y="80" width="80" height="28" fill="#fff" stroke="#e8eaed"/><text x="100" y="99" text-anchor="middle" font-size="12">2</text>
  <rect x="160" y="80" width="120" height="28" fill="#fff" stroke="#e8eaed"/><text x="220" y="99" text-anchor="middle" font-size="12">1101, 1111</text>
  <rect x="60" y="108" width="80" height="28" fill="#fff" stroke="#e8eaed"/><text x="100" y="127" text-anchor="middle" font-size="12">1</text>
  <rect x="160" y="108" width="120" height="28" fill="#fff" stroke="#e8eaed"/><text x="220" y="127" text-anchor="middle" font-size="12">0101, 0110</text>
  <rect x="60" y="136" width="80" height="28" fill="#fff" stroke="#e8eaed"/><text x="100" y="155" text-anchor="middle" font-size="12">0</text>
  <rect x="160" y="136" width="120" height="28" fill="#fff" stroke="#e8eaed"/><text x="220" y="155" text-anchor="middle" font-size="12">0001, 0010</text>
  <text x="260" y="195" text-anchor="middle" font-size="12" fill="#5c6370">Kết hợp các minterm khác nhau đúng 1 bit</text>
</svg>