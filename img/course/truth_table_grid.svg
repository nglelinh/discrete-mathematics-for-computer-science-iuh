  <text x="310" y="112" text-anchor="middle" font-size="14" fill="#1a1a2e">0</text>
  <text x="400" y="112" text-anchor="middle" font-size="14" fill="#1a1a2e">0</text>
  <rect x="80" y="126" width="360" height="40" fill="#fafbfc" stroke="#e8eaed"/>
  <text x="130" y="152" text-anchor="middle" font-size="14" fill="#1a1a2e">0</text>
  <text x="220" y="152" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <text x="310" y="152" text-anchor="middle" font-size="14" fill="#1a1a2e">0</text>
  <text x="400" y="152" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <rect x="80" y="166" width="360" height="40" fill="#fff" stroke="#e8eaed"/>
  <text x="130" y="192" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <text x="220" y="192" text-anchor="middle" font-size="14" fill="#1a1a2e">0</text>
  <text x="310" y="192" text-anchor="middle" font-size="14" fill="#1a1a2e">0</text>
  <text x="400" y="192" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <rect x="80" y="206" width="360" height="40" fill="#fafbfc" stroke="#e8eaed"/>
  <text x="130" y="232" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <text x="220" y="232" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <text x="310" y="232" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <text x="400" y="232" text-anchor="middle" font-size="14" fill="#1a1a2e">1</text>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#5c6370">2ⁿ dòng khi có n biến — không gian quyết định</text>
