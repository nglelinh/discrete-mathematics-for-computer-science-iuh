<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Truth table">
  <rect width="520" height="290" fill="#fafbfc"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Bảng chân trị — hai biến</text>
  <rect x="80" y="50" width="360" height="36" fill="#004586"/>
  <text x="130" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">p</text>
