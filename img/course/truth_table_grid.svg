  <text x="310" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">p ∧ q</text>
  <text x="400" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">p ∨ q</text>
  <rect x="80" y="86" width="360" height="40" fill="#fff" stroke="#e8eaed"/>
