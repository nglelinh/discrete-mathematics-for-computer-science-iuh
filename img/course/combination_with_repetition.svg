<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220">
  <title>Tổ hợp có lặp — chọn r đồ vật từ n loại</title>
  <rect width="520" height="220" fill="#ffffff"/>
  <text x="260" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Tổ hợp có lặp: chọn 5 bánh từ 3 loại</text>
  <text x="260" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Thứ tự không quan trọng — cùng loại có thể chọn nhiều lần</text>

  <!-- Loại 1 -->
  <rect x="40" y="70" width="120" height="100" rx="8" fill="#e8f4fd" stroke="#2b6cb0" stroke-width="2"/>
  <text x="100" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold">Loại 1</text>
  <text x="100" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12">x₁ = 2</text>
  <circle cx="75" cy="135" r="14" fill="#f6ad55" stroke="#c05621" stroke-width="1.5"/>
  <circle cx="125" cy="135" r="14" fill="#f6ad55" stroke="#c05621" stroke-width="1.5"/>

  <!-- Loại 2 -->
  <rect x="200" y="70" width="120" height="100" rx="8" fill="#fef3c7" stroke="#d69e2e" stroke-width="2"/>
  <text x="260" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold">Loại 2</text>
  <text x="260" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12">x₂ = 3</text>
  <circle cx="220" cy="135" r="14" fill="#f6ad55" stroke="#c05621" stroke-width="1.5"/>
  <circle cx="260" cy="135" r="14" fill="#f6ad55" stroke="#c05621" stroke-width="1.5"/>
  <circle cx="300" cy="135" r="14" fill="#f6ad55" stroke="#c05621" stroke-width="1.5"/>

  <!-- Loại 3 -->
  <rect x="360" y="70" width="120" height="100" rx="8" fill="#edf2f7" stroke="#718096" stroke-width="2"/>
  <text x="420" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold">Loại 3</text>
  <text x="420" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12">x₃ = 0</text>
  <text x="420" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096">(không chọn)</text>

  <text x="260" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13">Một cách chọn ↔ (x₁, x₂, x₃) với x₁+x₂+x₃ = 5</text>
</svg>