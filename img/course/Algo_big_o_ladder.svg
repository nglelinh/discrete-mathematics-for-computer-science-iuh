<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Big-O ladder">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 13px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>

  <text class="t" x="360" y="26" text-anchor="middle" font-size="15" font-weight="600">Bậc tăng trưởng thường gặp (minh họa tương đối)</text>
  <rect class="hi" x="80" y="200" width="40" height="40" rx="4"/><text class="l" x="100" y="260" text-anchor="middle">1</text>
  <rect class="hi" x="150" y="170" width="40" height="70" rx="4"/><text class="l" x="170" y="260" text-anchor="middle">log n</text>
  <rect class="hi" x="220" y="140" width="40" height="100" rx="4"/><text class="l" x="240" y="260" text-anchor="middle">n</text>
  <rect class="hi" x="290" y="100" width="40" height="140" rx="4"/><text class="l" x="310" y="260" text-anchor="middle">n log n</text>
  <rect class="hi" x="360" y="60" width="40" height="180" rx="4"/><text class="l" x="380" y="260" text-anchor="middle">n²</text>
  <rect x="430" y="40" width="40" height="200" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/><text class="l" x="450" y="260" text-anchor="middle">2ⁿ</text>
  <rect x="500" y="30" width="40" height="210" rx="4" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/><text class="l" x="520" y="260" text-anchor="middle">n!</text>
  <text class="cap" x="360" y="295" text-anchor="middle">O(1) ⊆ O(log n) ⊆ O(n) ⊆ O(n log n) ⊆ O(n²) ≪ mũ / giai thừa</text>

</svg>