<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Circular permutation">
  <rect width="720" height="400" fill="#fafbfc"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Hoán vị vòng tròn — 5 người quanh bàn</text>
  <text x="360.0" y="56" text-anchor="middle" font-size="13" fill="#5c6370">Xoay cả bàn → cùng một cách xếp · cố định 1 người → (n−1)!</text>
  <circle cx="360" cy="210" r="120" fill="#e8f0f8" stroke="#004586" stroke-width="2.5"/>
  <circle cx="360" cy="210" r="92" fill="#fafbfc" stroke="#c5cad1" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="360.0" cy="90.0" r="22" fill="#dbeafe" stroke="#004586" stroke-width="3"/>
  <text x="360.0" y="95.0" text-anchor="middle" font-size="16" font-weight="700" fill="#004586">A</text>
  <text x="360.0" y="58.0" text-anchor="middle" font-size="11" font-weight="600" fill="#004586">cố định</text>
  <circle cx="474.1" cy="172.9" r="20" fill="white" stroke="#004586" stroke-width="2"/>
  <text x="474.1" y="177.9" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">B</text>
  <circle cx="430.5" cy="307.1" r="20" fill="white" stroke="#004586" stroke-width="2"/>
  <text x="430.5" y="312.1" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">C</text>
  <circle cx="289.5" cy="307.1" r="20" fill="white" stroke="#004586" stroke-width="2"/>
  <text x="289.5" y="312.1" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">D</text>
  <circle cx="245.9" cy="172.9" r="20" fill="white" stroke="#004586" stroke-width="2"/>
  <text x="245.9" y="177.9" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">E</text>
  <rect x="40" y="320" width="640" height="52" rx="8" fill="#eef4fa" stroke="#c5cad1"/>
  <text x="360.0" y="352" text-anchor="middle" font-size="16" fill="#1a1a2e">n = 5 · số cách = (5−1)! = 4! = 24  ·  (tương đương n!/n)</text>
</svg>
