<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="Source Sans Pro, Inter, Arial, sans-serif" role="img" aria-label="Series and parallel switches">
  <rect width="720" height="310" fill="#fafbfc"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Mạng công tắc ↔ phép Boole</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#5c6370">Đóng = 1 · hở = 0 · có dòng từ trái sang phải = 1</text>

  <!-- Series -->
  <text x="180" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#004586">Nối tiếp → AND</text>
  <line x1="40" y1="130" x2="320" y2="130" stroke="#004586" stroke-width="2.5"/>
  <polygon points="40,130 55,122 55,138" fill="#004586"/>
  <polygon points="320,130 305,122 305,138" fill="#004586"/>
  <!-- switch A -->
  <line x1="100" y1="130" x2="100" y2="110" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="100" y1="110" x2="125" y2="100" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="112" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">A</text>
  <text x="112" y="155" text-anchor="middle" font-size="12" fill="#5c6370">a</text>
  <!-- switch B -->
  <line x1="200" y1="130" x2="200" y2="110" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="200" y1="110" x2="225" y2="100" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="212" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">B</text>
  <text x="212" y="155" text-anchor="middle" font-size="12" fill="#5c6370">b</text>
  <text x="280" y="120" font-size="14" font-weight="600" fill="#1a1a2e">t(a,b)</text>
  <text x="180" y="185" text-anchor="middle" font-size="14" fill="#1a1a2e">t(a, b) = a · b</text>
  <text x="180" y="205" text-anchor="middle" font-size="12" fill="#5c6370">Cả hai đóng mới có dòng</text>

  <!-- Parallel -->
  <text x="540" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#004586">Song song → OR</text>
  <line x1="400" y1="130" x2="430" y2="130" stroke="#004586" stroke-width="2.5"/>
  <polygon points="400,130 415,122 415,138" fill="#004586"/>
  <line x1="430" y1="100" x2="430" y2="160" stroke="#004586" stroke-width="2.5"/>
  <line x1="430" y1="100" x2="580" y2="100" stroke="#004586" stroke-width="2.5"/>
  <line x1="430" y1="160" x2="580" y2="160" stroke="#004586" stroke-width="2.5"/>
  <line x1="580" y1="100" x2="580" y2="160" stroke="#004586" stroke-width="2.5"/>
  <line x1="580" y1="130" x2="680" y2="130" stroke="#004586" stroke-width="2.5"/>
  <polygon points="680,130 665,122 665,138" fill="#004586"/>
  <!-- switches on parallel arms -->
  <line x1="490" y1="100" x2="490" y2="80" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="490" y1="80" x2="515" y2="70" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="502" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">A</text>
  <line x1="490" y1="160" x2="490" y2="180" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="490" y1="180" x2="515" y2="190" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="502" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e">B</text>
  <text x="640" y="120" font-size="14" font-weight="600" fill="#1a1a2e">t(a,b)</text>
  <text x="540" y="235" text-anchor="middle" font-size="14" fill="#1a1a2e">t(a, b) = a + b</text>
  <text x="540" y="255" text-anchor="middle" font-size="12" fill="#5c6370">Một trong hai đóng là đủ</text>

  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#1a1a2e">Ghép nối tiếp + song song → biểu thức Boole của cả mạng</text>
</svg>