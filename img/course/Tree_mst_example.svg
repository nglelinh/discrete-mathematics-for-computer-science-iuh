<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-label="MST example">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 14px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Cây khung nhỏ nhất (MST)</text>
  <!-- full graph faded edges -->
  <line class="e" x1="120" y1="100" x2="280" y2="80" stroke-opacity="0.35"/>
  <line class="e" x1="280" y1="80" x2="440" y2="100" stroke-opacity="0.35"/>
  <line class="e" x1="120" y1="100" x2="200" y2="220" stroke-opacity="0.35"/>
  <line class="e" x1="280" y1="80" x2="280" y2="220" stroke-opacity="0.35"/>
  <line class="e" x1="440" y1="100" x2="360" y2="220" stroke-opacity="0.35"/>
  <line class="e" x1="200" y1="220" x2="280" y2="220" stroke-opacity="0.35"/>
  <line class="e" x1="280" y1="220" x2="360" y2="220" stroke-opacity="0.35"/>
  <!-- MST edges highlighted -->
  <line x1="120" y1="100" x2="280" y2="80" stroke="#004586" stroke-width="3.5"/>
  <line x1="280" y1="80" x2="280" y2="220" stroke="#004586" stroke-width="3.5"/>
  <line x1="280" y1="220" x2="360" y2="220" stroke="#004586" stroke-width="3.5"/>
  <line x1="280" y1="80" x2="440" y2="100" stroke="#004586" stroke-width="3.5"/>
    <circle class="n" cx="120" cy="100" r="18"/>
  <text class="nt" x="120" y="105" text-anchor="middle">A</text>
    <circle class="n" cx="280" cy="80" r="18"/>
  <text class="nt" x="280" y="85" text-anchor="middle">B</text>
    <circle class="n" cx="440" cy="100" r="18"/>
  <text class="nt" x="440" y="105" text-anchor="middle">C</text>
    <circle class="n" cx="200" cy="220" r="18"/>
  <text class="nt" x="200" y="225" text-anchor="middle">D</text>
    <circle class="n" cx="280" cy="220" r="18"/>
  <text class="nt" x="280" y="225" text-anchor="middle">E</text>
    <circle class="n" cx="360" cy="220" r="18"/>
  <text class="nt" x="360" y="225" text-anchor="middle">F</text>
  <text class="l" x="180" y="70">1</text>
  <text class="l" x="360" y="70">2</text>
  <text class="l" x="300" y="150">3</text>
  <text class="l" x="320" y="210">4</text>
  <text class="cap" x="360" y="280" text-anchor="middle">MST: n−1 cạnh, không chu trình, tổng trọng số nhỏ nhất · Kruskal / Prim</text>

</svg>
