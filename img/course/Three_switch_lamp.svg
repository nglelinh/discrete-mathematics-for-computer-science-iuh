  <text x="50" y="160" font-size="15" font-weight="600" fill="#1a1a2e">B</text>
  <text x="50" y="240" font-size="15" font-weight="600" fill="#1a1a2e">C</text>

  <line x1="70" y1="95" x2="140" y2="115" stroke="#004586" stroke-width="2.5"/>
  <line x1="70" y1="155" x2="140" y2="145" stroke="#004586" stroke-width="2.5"/>
  
  <path d="M130.0,103.75 Q146.75,130 130.0,156.25" fill="none" stroke="#004586" stroke-width="2"/>
  <path d="M140,103.75 Q161.6,103.75 173.75,103.75 Q199.4,103.75 199.4,130
