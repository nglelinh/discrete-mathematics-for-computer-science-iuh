  <text x="168.35" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#004586">XNOR</text>
  <line x1="235" y1="130" x2="300" y2="130" stroke="#004586" stroke-width="2.5"/>
  <text x="255" y="118" font-size="12" fill="#5c6370">A⊙B</text>

  <line x1="70" y1="235" x2="140" y2="235" stroke="#004586" stroke-width="2.5"/>
  
  <path d="M140,209.7 L175.42,235 L140,260.3 Z" fill="#fff" stroke="#004586" stroke-width="2"/>
  <circle cx="182.32" cy="235" r="5.75" fill="#fff" stroke="#004586" stroke-width="2"/>
  <line x1="200" y1="235" x2="300" y2="235" stroke="#004586" stroke-width="2.5"/>
  <line x1="300" y1="235" x2="300" y2="150" stroke="#004586" stroke-width="2.5"/>
  <text x="215" y="255" font-size="12" fill="#5c6370">C̄</text>

  <line x1="300" y1="130" x2="340" y2="130" stroke="#004586" stroke-width="2.5"/>
  <line x1="300" y1="150" x2="340" y2="150" stroke="#004586" stroke-width="2.5"/>
  
  <path d="M340,115.0 L371.5,115.0 Q410.0,115.0 410.0,140 Q410.0,165.0 371.5,165.0 L340,165.0 Z"
