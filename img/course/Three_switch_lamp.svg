  <text x="369.4" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#004586">AND</text>
  <line x1="420" y1="140" x2="500" y2="140" stroke="#004586" stroke-width="2.5"/>

  <circle cx="540" cy="140" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="540" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#d97706">Y</text>
  <text x="540" y="185" text-anchor="middle" font-size="12" fill="#5c6370">đèn</text>
  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#1a1a2e">Rút gọn từ ĀB̄C̄ + ABC̄</text>
