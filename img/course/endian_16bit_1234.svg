<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, Arial, sans-serif">
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600">Cùng số 0x1234 — khác thứ tự byte trong RAM</text>

  <text x="40" y="58" font-size="13" fill="#475569">Giá trị toán học (không đổi):</text>
  <text x="220" y="58" font-size="16" font-weight="700">0x1234 = 4660₁₀</text>
  <text x="40" y="78" font-size="12" fill="#64748b">16 bit = 2 byte: byte cao (MSB) = 0x12, byte thấp (LSB) = 0x34</text>

  <!-- Big-endian -->
  <text x="40" y="108" font-size="14" font-weight="600" fill="#1d4ed8">Big-endian</text>
  <text x="160" y="108" font-size="12" fill="#64748b">“Đọc hex như viết trên giấy” — byte cao ở địa chỉ thấp</text>
  <rect x="40" y="118" width="90" height="44" fill="#dbeafe" stroke="#334155"/>
  <rect x="130" y="118" width="90" height="44" fill="#fff" stroke="#334155"/>
  <text x="85" y="136" text-anchor="middle" font-size="11" fill="#64748b">addr 1000</text>
  <text x="175" y="136" text-anchor="middle" font-size="11" fill="#64748b">addr 1001</text>
  <text x="85" y="154" text-anchor="middle" font-size="18" font-weight="700">12</text>
  <text x="175" y="154" text-anchor="middle" font-size="18" font-weight="700">34</text>
  <text x="240" y="145" font-size="12">→ đọc từ trái sang: 12 rồi 34</text>

  <!-- Little-endian -->
  <text x="40" y="198" font-size="14" font-weight="600" fill="#b45309">Little-endian</text>
  <text x="180" y="198" font-size="12" fill="#64748b">“Byte thấp trước” — x86, ARM, PC của bạn</text>
  <rect x="40" y="208" width="90" height="44" fill="#fff" stroke="#334155"/>
  <rect x="130" y="208" width="90" height="44" fill="#ffedd5" stroke="#334155"/>
  <text x="85" y="226" text-anchor="middle" font-size="11" fill="#64748b">addr 1000</text>
  <text x="175" y="226" text-anchor="middle" font-size="11" fill="#64748b">addr 1001</text>
  <text x="85" y="244" text-anchor="middle" font-size="18" font-weight="700">34</text>
  <text x="175" y="244" text-anchor="middle" font-size="18" font-weight="700">12</text>
  <text x="240" y="235" font-size="12">→ đọc từ trái sang: 34 rồi 12 (ngược big-endian)</text>

  <text x="360" y="295" text-anchor="middle" font-size="12" fill="#64748b">Endianness chỉ đổi thứ tự byte trên bộ nhớ — giá trị số 0x1234 vẫn là 4660</text>
</svg>