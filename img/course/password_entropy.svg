<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Source Sans Pro, Inter, Helvetica Neue, Arial, Helvetica, sans-serif" role="img" aria-label="Không gian mật khẩu N mũ L và entropy H bằng L nhân log cơ số 2 của N bit. So sánh 8 ký tự chữ thường với 12 ký tự ASCII in được.">
  <rect width="920" height="560" fill="#fafbfc"/>

  <text x="460" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a2e">Entropy mật khẩu: không gian N<tspan font-size="12" dy="-6">L</tspan><tspan dy="6"> và thời gian vét cạn</tspan></text>
  <text x="460" y="52" text-anchor="middle" font-size="13" fill="#5c6370">Mỗi vị trí chọn độc lập một trong N ký tự. Mật khẩu dài L vị trí thì có đúng N<tspan font-size="10" dy="-5">L</tspan><tspan dy="5"> chuỗi; entropy H = L · log</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> N bit.</tspan></text>

  <text x="36" y="80" font-size="13" font-weight="600" fill="#1a1a2e">Bảng chữ cái — số ký tự N</text>

  <!-- N = 26, used in the table -->
  <rect x="36" y="90" width="200" height="62" rx="8" fill="#dbeafe" stroke="#004586" stroke-width="1.75"/>
  <text x="136" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">N = 26</text>
  <text x="136" y="136" text-anchor="middle" font-size="12" fill="#334155">chữ thường a–z</text>

  <!-- N = 52 -->
  <rect x="252" y="90" width="200" height="62" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="352" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">N = 52</text>
  <text x="352" y="136" text-anchor="middle" font-size="12" fill="#5c6370">chữ hoa và chữ thường</text>

  <!-- N = 62 -->
  <rect x="468" y="90" width="200" height="62" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="568" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">N = 62</text>
  <text x="568" y="136" text-anchor="middle" font-size="12" fill="#5c6370">chữ và chữ số</text>

  <!-- N = 94, used in the table -->
  <rect x="684" y="90" width="200" height="62" rx="8" fill="#dbeafe" stroke="#004586" stroke-width="1.75"/>
  <text x="784" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">N = 94</text>
  <text x="784" y="136" text-anchor="middle" font-size="12" fill="#334155">ASCII in được</text>

  <text x="36" y="178" font-size="13" font-weight="600" fill="#1a1a2e">Mật khẩu dài L vị trí — mỗi ô là một vị trí, có N cách chọn (hình minh họa L = 8)</text>

  <rect x="125.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="159.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="159.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">1</text>
  <text x="202.0" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#004586">×</text>
  <rect x="211.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="245.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="245.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">2</text>
  <text x="288.0" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#004586">×</text>
  <rect x="297.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="331.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="331.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">3</text>
  <text x="374.0" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#004586">×</text>
  <rect x="383.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="417.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="417.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">4</text>
  <text x="460.0" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#004586">×</text>
  <rect x="469.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="503.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="503.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">5</text>
  <text x="546.0" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#004586">×</text>
  <rect x="555.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="589.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="589.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">6</text>
  <text x="632.0" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#004586">×</text>
  <rect x="641.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="675.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="675.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">7</text>
  <text x="718.0" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#004586">×</text>
  <rect x="727.0" y="190" width="68" height="50" rx="8" fill="#fff" stroke="#004586" stroke-width="1.5"/>
  <text x="761.0" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#004586">N</text>
  <text x="761.0" y="254" text-anchor="middle" font-size="11" fill="#64748b">8</text>

  <!-- Formula pills -->
  <rect x="80" y="268" width="360" height="56" rx="10" fill="#dbeafe" stroke="#004586" stroke-width="2"/>
  <text x="260" y="302" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">số mật khẩu  =  N<tspan font-size="12" dy="-6">L</tspan></text>

  <rect x="480" y="268" width="360" height="56" rx="10" fill="#dbeafe" stroke="#004586" stroke-width="2"/>
  <text x="660" y="302" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">H  =  L · log<tspan font-size="11" dy="5">2</tspan><tspan dy="-5"> N    bit</tspan></text>

  <text x="36" y="352" font-size="13" font-weight="600" fill="#1a1a2e">So sánh hai chính sách</text>
  <text x="36" y="370" font-size="12" fill="#5c6370">Giả sử tốc độ thử R = 10<tspan font-size="9" dy="-5">9</tspan><tspan dy="5"> mật khẩu/giây (tấn công ngoại tuyến khi hàm băm yếu bị lộ). Thời gian trung bình = (N</tspan><tspan font-size="9" dy="-5">L</tspan><tspan dy="5"> / 2) / R.</tspan></text>

  <!-- Table frame -->
  <rect x="36" y="384" width="848" height="112" rx="8" fill="#fff" stroke="#004586" stroke-width="1.25"/>
  <!-- header -->
  <rect x="36" y="384" width="848" height="36" rx="8" fill="#dbeafe" stroke="none"/>
  <rect x="36" y="404" width="848" height="16" fill="#dbeafe"/>

  <!-- row 2 background (second data row) -->
  <rect x="36.5" y="456" width="847" height="40" fill="#f8fafc"/>

  <!-- vertical rules -->
  <line x1="250" y1="384" x2="250" y2="496" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="318" y1="384" x2="318" y2="496" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="386" y1="384" x2="386" y2="496" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="560" y1="384" x2="560" y2="496" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="678" y1="384" x2="678" y2="496" stroke="#bfdbfe" stroke-width="1"/>
  <!-- bottom border of header -->
  <line x1="36" y1="420" x2="884" y2="420" stroke="#004586" stroke-width="1"/>
  <!-- rounded bottom already from outer rect; cover overflow of header rx -->
  <rect x="36" y="496" width="848" height="0.01" fill="none"/>

  <!-- header labels; column centers:
       chính sách 36-250 cx=143
       N 250-318 cx=284
       L 318-386 cx=352
       space 386-560 cx=473
       H 560-678 cx=619
       time 678-884 cx=781
  -->
  <text x="143" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Chính sách</text>
  <text x="284" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">N</text>
  <text x="352" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">L</text>
  <text x="473" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Số mật khẩu N<tspan font-size="9" dy="-4">L</tspan></text>
  <text x="619" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Entropy H</text>
  <text x="781" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a2e">Thời gian trung bình</text>

  <!-- row 1: 8-char lowercase -->
  <text x="143" y="444" text-anchor="middle" font-size="13" fill="#1a1a2e">8 ký tự chữ thường</text>
  <text x="284" y="444" text-anchor="middle" font-size="13" fill="#1a1a2e">26</text>
  <text x="352" y="444" text-anchor="middle" font-size="13" fill="#1a1a2e">8</text>
  <text x="473" y="444" text-anchor="middle" font-size="13" fill="#1a1a2e">2,09 × 10<tspan font-size="10" dy="-5">11</tspan></text>
  <text x="619" y="444" text-anchor="middle" font-size="13" fill="#1a1a2e">37,6 bit</text>
  <text x="781" y="444" text-anchor="middle" font-size="13" font-weight="600" fill="#d97706">≈ 1,7 phút</text>

  <!-- row 2: 12-char printable ASCII -->
  <text x="143" y="484" text-anchor="middle" font-size="13" fill="#1a1a2e">12 ký tự ASCII in được</text>
  <text x="284" y="484" text-anchor="middle" font-size="13" fill="#1a1a2e">94</text>
  <text x="352" y="484" text-anchor="middle" font-size="13" fill="#1a1a2e">12</text>
  <text x="473" y="484" text-anchor="middle" font-size="13" fill="#1a1a2e">4,76 × 10<tspan font-size="10" dy="-5">23</tspan></text>
  <text x="619" y="484" text-anchor="middle" font-size="13" fill="#1a1a2e">78,7 bit</text>
  <text x="781" y="484" text-anchor="middle" font-size="13" font-weight="600" fill="#004586">≈ 7,54 triệu năm</text>

  <text x="460" y="524" text-anchor="middle" font-size="12" fill="#5c6370">N = 94 là các ký tự ASCII in được, mã 33–126, không kể dấu cách. R = 10<tspan font-size="9" dy="-4">9</tspan><tspan dy="4"> là giả định tốc độ, không phải số đo từ một vụ tấn công cụ thể.</tspan></text>
  <text x="460" y="544" text-anchor="middle" font-size="12" fill="#64748b">Cùng giả định này, mật khẩu 8 ký tự chữ thường bị duyệt trong vài phút, còn 12 ký tự ASCII in được đòi hỏi hàng triệu năm.</text>
</svg>
