<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Matching">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 14px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Ghép cặp trên đồ thị hai phía</text>
  <line class="e" x1="180" y1="90" x2="480" y2="100"/>
  <line class="e" x1="180" y1="90" x2="480" y2="180"/>
  <line class="e" x1="180" y1="170" x2="480" y2="180"/>
  <line class="e" x1="180" y1="170" x2="480" y2="260"/>
  <line class="e" x1="180" y1="250" x2="480" y2="260"/>
  <!-- matching highlighted -->
  <line x1="180" y1="90" x2="480" y2="100" stroke="#004586" stroke-width="3.5"/>
  <line x1="180" y1="170" x2="480" y2="260" stroke="#004586" stroke-width="3.5"/>
    <circle class="n" cx="180" cy="90" r="18"/>
  <text class="nt" x="180" y="95" text-anchor="middle">1</text>
    <circle class="n" cx="180" cy="170" r="18"/>
  <text class="nt" x="180" y="175" text-anchor="middle">2</text>
    <circle class="n" cx="180" cy="250" r="18"/>
  <text class="nt" x="180" y="255" text-anchor="middle">3</text>
    <circle class="n" cx="480" cy="100" r="18"/>
  <text class="nt" x="480" y="105" text-anchor="middle">a</text>
    <circle class="n" cx="480" cy="180" r="18"/>
  <text class="nt" x="480" y="185" text-anchor="middle">b</text>
    <circle class="n" cx="480" cy="260" r="18"/>
  <text class="nt" x="480" y="265" text-anchor="middle">c</text>
  <text class="l" x="100" y="60">L (jobs)</text>
  <text class="l" x="500" y="70">R (machines)</text>
  <text class="cap" x="360" y="310" text-anchor="middle">Matching: cạnh không chung đỉnh · matching max bipartite: đa thức (Hopcroft–Karp)</text>

</svg>