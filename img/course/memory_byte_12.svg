<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Inter, Arial, sans-serif">
  <rect width="560" height="240" fill="#f8fafc"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="600">Một ô nhớ = 1 byte = 8 bit</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#64748b">Địa chỉ 1000 — giá trị hex 0x12 (thập phân 18)</text>

  <rect x="40" y="70" width="120" height="100" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="100" y="95" text-anchor="middle" font-size="13" font-weight="600">Ô 1000</text>
  <text x="100" y="115" text-anchor="middle" font-size="12" fill="#475569">1 byte</text>
  <text x="100" y="150" text-anchor="middle" font-size="22" font-weight="700">0x12</text>

  <text x="190" y="125" font-size="20">→</text>

  <g transform="translate(220,78)">
    <text x="0" y="-6" font-size="11" fill="#64748b">8 bit (trái = bit cao)</text>
    <rect x="0" y="0" width="36" height="36" fill="#dbeafe" stroke="#334155"/><text x="18" y="23" text-anchor="middle" font-size="14">0</text>
    <rect x="40" y="0" width="36" height="36" fill="#dbeafe" stroke="#334155"/><text x="58" y="23" text-anchor="middle" font-size="14">0</text>
    <rect x="80" y="0" width="36" height="36" fill="#dbeafe" stroke="#334155"/><text x="98" y="23" text-anchor="middle" font-size="14">0</text>
    <rect x="120" y="0" width="36" height="36" fill="#dbeafe" stroke="#334155"/><text x="138" y="23" text-anchor="middle" font-size="14">1</text>
    <rect x="160" y="0" width="36" height="36" fill="#ffedd5" stroke="#334155"/><text x="178" y="23" text-anchor="middle" font-size="14">0</text>
    <rect x="200" y="0" width="36" height="36" fill="#ffedd5" stroke="#334155"/><text x="218" y="23" text-anchor="middle" font-size="14">0</text>
    <rect x="240" y="0" width="36" height="36" fill="#ffedd5" stroke="#334155"/><text x="258" y="23" text-anchor="middle" font-size="14">1</text>
    <rect x="280" y="0" width="36" height="36" fill="#dbeafe" stroke="#334155"/><text x="298" y="23" text-anchor="middle" font-size="14">0</text>
    <text x="150" y="58" text-anchor="middle" font-size="11" fill="#64748b">nhị phân: 0001 0010</text>
  </g>

  <rect x="40" y="185" width="480" height="42" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#475569">Ô 1001 chứa 0x34 tương tự (8 bit khác). CPU đọc hai ô liền kề để ghép thành 0x1234.</text>
</svg>