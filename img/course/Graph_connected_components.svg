<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Connected components">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .ea { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .nt { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 15px; }
    .cap { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Thành phần liên thông</text>
  <!-- component 1 -->
  <rect x="40" y="60" width="200" height="180" rx="12" fill="#e8f1fb" stroke="#004586" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line class="e" x1="90" y1="110" x2="160" y2="100"/>
  <line class="e" x1="90" y1="110" x2="120" y2="180"/>
  <line class="e" x1="160" y1="100" x2="120" y2="180"/>
    <circle class="n" cx="90" cy="110" r="16"/>
  <text class="nt" x="90" y="115" text-anchor="middle">1</text>
    <circle class="n" cx="160" cy="100" r="16"/>
  <text class="nt" x="160" y="105" text-anchor="middle">2</text>
    <circle class="n" cx="120" cy="180" r="16"/>
  <text class="nt" x="120" y="185" text-anchor="middle">3</text>
  <text class="l" x="140" y="220" text-anchor="middle">C₁ = {1,2,3}</text>
  <!-- component 2 -->
  <rect x="280" y="80" width="160" height="140" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line class="e" x1="320" y1="130" x2="400" y2="150" style="stroke:#15803d"/>
    <circle class="n" cx="320" cy="130" r="16"/>
  <text class="nt" x="320" y="135" text-anchor="middle">4</text>
    <circle class="n" cx="400" cy="150" r="16"/>
  <text class="nt" x="400" y="155" text-anchor="middle">5</text>
  <text class="l" x="360" y="200" text-anchor="middle">C₂ = {4,5}</text>
  <!-- component 3 -->
  <rect x="500" y="90" width="140" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle class="n" cx="570" cy="150" r="16"/>
  <text class="nt" x="570" y="155" text-anchor="middle">6</text>
  <text class="l" x="570" y="200" text-anchor="middle">C₃ = {6}</text>
  <text class="cap" x="360" y="280" text-anchor="middle">Ba thành phần liên thông: không có đường đi giữa các cụm khác nhau</text>

</svg>
