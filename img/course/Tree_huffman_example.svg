<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Huffman tree">
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <style>
    .t { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #1a2332; }
    .l { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 13px; }
    .nt { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #004586; font-weight: 700; font-size: 14px; }
    .cap { font-family: 'Source Sans 3', Helvetica, Arial, sans-serif; fill: #5a6570; font-size: 12px; }
    .e { stroke: #334155; stroke-width: 2; fill: none; }
    .n { fill: white; stroke: #004586; stroke-width: 2.2; }
    .box { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
    .hi { fill: #e8f1fb; stroke: #004586; stroke-width: 1.5; }
  </style>

  <text class="t" x="360" y="28" text-anchor="middle" font-size="16" font-weight="600">Cây Huffman (prefix-free)</text>
  <line class="e" x1="360" y1="80" x2="220" y2="160"/>
  <line class="e" x1="360" y1="80" x2="500" y2="160"/>
  <line class="e" x1="220" y1="180" x2="140" y2="260"/>
  <line class="e" x1="220" y1="180" x2="280" y2="260"/>
  <line class="e" x1="500" y1="180" x2="500" y2="260"/>
    <circle class="n" cx="360" cy="70" r="18"/>
  <text class="nt" x="360" y="75" text-anchor="middle">•</text>
    <circle class="n" cx="220" cy="170" r="18"/>
  <text class="nt" x="220" y="175" text-anchor="middle">•</text>
    <circle class="n" cx="500" cy="170" r="18"/>
  <text class="nt" x="500" y="175" text-anchor="middle">A:5</text>
    <circle class="n" cx="140" cy="270" r="18"/>
  <text class="nt" x="140" y="275" text-anchor="middle">B:2</text>
    <circle class="n" cx="280" cy="270" r="18"/>
  <text class="nt" x="280" y="275" text-anchor="middle">C:2</text>
  <text class="l" x="270" y="115">0</text>
  <text class="l" x="430" y="115">1</text>
  <text class="l" x="160" y="210">0</text>
  <text class="l" x="250" y="210">1</text>
  <text class="l" x="80" y="310">B→00 · C→01 · A→1 (ví dụ minh họa)</text>
  <text class="cap" x="360" y="340" text-anchor="middle">Greedy: luôn gộp hai nút nhẹ nhất · không mã nào là tiền tố của mã khác</text>

</svg>
